<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ella — Project Documentation</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Marked Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Prism Syntax Highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" id="prism-theme" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <style>
    /* Styling System */
    :root {
      /* Dark mode variables (Default) */
      --bg: #090d16;
      --sidebar-bg: rgba(13, 20, 35, 0.85);
      --card-bg: #111827;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --text-heading: #f3f4f6;
      --border: #1f2937;
      --accent: #10b981;
      --accent-hover: #34d399;
      --accent-soft: rgba(16, 185, 129, 0.1);
      --code-bg: #111827;
      --scrollbar-bg: #090d16;
      --scrollbar-thumb: #1f2937;
      
      /* Alert colors */
      --note-bg: rgba(59, 130, 246, 0.1);
      --note-border: #3b82f6;
      --tip-bg: rgba(16, 185, 129, 0.1);
      --tip-border: #10b981;
      --warning-bg: rgba(245, 158, 11, 0.1);
      --warning-border: #f59e0b;
      --danger-bg: rgba(239, 68, 68, 0.1);
      --danger-border: #ef4444;
    }

    html.light {
      /* Light mode variables */
      --bg: #fafafa;
      --sidebar-bg: rgba(249, 250, 251, 0.9);
      --card-bg: #ffffff;
      --text: #374151;
      --text-muted: #6b7280;
      --text-heading: #111827;
      --border: #e5e7eb;
      --accent: #059669;
      --accent-hover: #10b981;
      --accent-soft: rgba(5, 150, 105, 0.08);
      --code-bg: #f3f4f6;
      --scrollbar-bg: #fafafa;
      --scrollbar-thumb: #d1d5db;
      
      --note-bg: rgba(59, 130, 246, 0.05);
      --tip-bg: rgba(16, 185, 129, 0.05);
      --warning-bg: rgba(245, 158, 11, 0.05);
      --danger-bg: rgba(239, 68, 68, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s, border-color 0.2s;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--scrollbar-bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    /* Sidebar Design (Glassmorphism) */
    .sidebar {
      width: 280px;
      background-color: var(--sidebar-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 50;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-box {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      box-shadow: 0 4px 12px var(--accent-soft);
    }

    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: -2px;
    }

    .search-container {
      padding: 16px 24px 8px;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px 8px 36px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }

    .nav-menu {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .nav-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
    }

    .nav-item a:hover {
      background-color: var(--accent-soft);
      color: var(--text-heading);
    }

    .nav-item.active a {
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    /* Main Area Layout */
    .main-container {
      margin-left: 280px;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Bar */
    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      position: sticky;
      top: 0;
      background-color: rgba(9, 13, 22, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 40;
    }

    html.light .topbar {
      background-color: rgba(250, 250, 250, 0.8);
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background-color: var(--border);
      color: var(--text-heading);
    }

    .breadcrumb {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Content Area styling */
    .content-wrapper {
      flex: 1;
      padding: 48px 40px 80px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    /* Markdown styling (Mintlify Premium theme) */
    .doc-content {
      font-size: 15.5px;
      color: var(--text);
    }

    .doc-content h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -1px;
      margin-bottom: 24px;
      line-height: 1.2;
    }

    .doc-content h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-heading);
      letter-spacing: -0.5px;
      margin-top: 40px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .doc-content h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-heading);
      margin-top: 28px;
      margin-bottom: 12px;
    }

    .doc-content p {
      margin-bottom: 18px;
    }

    .doc-content a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
    }

    .doc-content a:hover {
      border-bottom-color: var(--accent);
    }

    .doc-content ul, .doc-content ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .doc-content li {
      margin-bottom: 8px;
    }

    .doc-content code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      background-color: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-hover);
      border: 1px solid var(--border);
    }

    .doc-content pre {
      margin: 24px 0;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .doc-content pre code {
      display: block;
      padding: 16px;
      overflow-x: auto;
      font-size: 13px;
      background-color: var(--code-bg);
      border: none;
      color: inherit;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .doc-content pre:hover .copy-btn {
      opacity: 1;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Alerts / Callouts */
    .alert {
      padding: 16px 20px;
      border-radius: 8px;
      border-left: 4px solid var(--border);
      margin: 24px 0;
      font-size: 14.5px;
      display: flex;
      gap: 12px;
    }

    .alert-icon {
      flex: none;
      width: 20px;
      height: 20px;
      margin-top: 2px;
    }

    .alert-body {
      flex: 1;
    }

    .alert-body strong {
      display: block;
      margin-bottom: 4px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
    }

    .alert-note { background-color: var(--note-bg); border-left-color: var(--note-border); }
    .alert-note .alert-icon { color: var(--note-border); }
    .alert-note strong { color: var(--note-border); }

    .alert-tip { background-color: var(--tip-bg); border-left-color: var(--tip-border); }
    .alert-tip .alert-icon { color: var(--tip-border); }
    .alert-tip strong { color: var(--tip-border); }

    .alert-warning { background-color: var(--warning-bg); border-left-color: var(--warning-border); }
    .alert-warning .alert-icon { color: var(--warning-border); }
    .alert-warning strong { color: var(--warning-border); }

    .alert-danger { background-color: var(--danger-bg); border-left-color: var(--danger-border); }
    .alert-danger .alert-icon { color: var(--danger-border); }
    .alert-danger strong { color: var(--danger-border); }

    /* Tables */
    .doc-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
      font-size: 14px;
    }

    .doc-content th, .doc-content td {
      border: 1px solid var(--border);
      padding: 12px 16px;
      text-align: left;
    }

    .doc-content th {
      background-color: var(--card-bg);
      font-weight: 600;
      color: var(--text-heading);
    }

    .doc-content tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.015);
    }
    
    html.light .doc-content tr:nth-child(even) {
      background-color: rgba(0, 0, 0, 0.01);
    }

    /* Page Navigation (Next/Prev) */
    .page-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
      gap: 16px;
    }

    .nav-card {
      flex: 1;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-card:hover {
      border-color: var(--accent);
      background-color: var(--accent-soft);
    }

    .nav-card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .nav-card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-heading);
    }

    /* Search Results overlay */
    .search-overlay {
      display: none;
      position: absolute;
      top: 60px;
      left: 24px;
      right: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
      max-height: 300px;
      overflow-y: auto;
    }

    .search-result-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .search-result-item:hover {
      background-color: var(--accent-soft);
      color: var(--accent);
    }

    .search-result-title {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .search-result-snippet {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Mobile Responsive styles */
    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
      }
      
      .sidebar.open {
        transform: translateX(0);
      }

      .main-container {
        margin-left: 0;
      }

      .hamburger {
        display: block;
      }

      .topbar {
        padding: 0 20px;
      }

      .content-wrapper {
        padding: 30px 20px 60px;
      }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-box">E</div>
      <div>
        <h1 class="brand-name">Ella Specs</h1>
        <div class="brand-sub">Documentation Portal</div>
      </div>
    </div>
    
    <div class="search-container">
      <div class="search-wrapper">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" placeholder="Search specs..." class="search-input" id="search-input" autocomplete="off" />
      </div>
      <div class="search-overlay" id="search-results"></div>
    </div>

    <nav class="nav-menu" id="nav-menu">
      <!-- Generated dynamically -->
    </nav>
  </aside>

  <!-- Right Main Layout -->
  <div class="main-container">
    <header class="topbar">
      <button class="hamburger" id="hamburger">
        <i data-lucide="menu"></i>
      </button>
      <div class="breadcrumb" id="breadcrumb">
        <span>Ella Specs</span>
        <i data-lucide="chevron-right" style="width:14px;height:14px;"></i>
        <span id="breadcrumb-current" style="color:var(--text-heading);font-weight:500;">Overview</span>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" id="theme-toggle">
          <i data-lucide="sun" id="sun-icon"></i>
          <i data-lucide="moon" id="moon-icon" style="display:none;"></i>
        </button>
        <a href="https://github.com/navgurukul/ella_flutter" target="_blank" class="btn-icon">
          <i data-lucide="github"></i>
        </a>
      </div>
    </header>

    <main class="content-wrapper">
      <article class="doc-content" id="doc-content">
        <!-- Rendered markdown goes here -->
      </article>

      <!-- Next / Previous Page Navigation -->
      <div class="page-nav">
        <a href="#" class="nav-card" id="prev-card" style="display:none;">
          <span class="nav-card-label">← Previous</span>
          <span class="nav-card-title" id="prev-title">Title</span>
        </a>
        <a href="#" class="nav-card" id="next-card" style="display:none; text-align:right;">
          <span class="nav-card-label">Next →</span>
          <span class="nav-card-title" id="next-title">Title</span>
        </a>
      </div>
    </main>
  </div>

  <script>
    // App State
    let navData = [];
    let allPages = []; // Flat list of all pages for search and nav mapping
    let currentPageFile = '';

    // Initialize Markdown and Lucide
    marked.setOptions({
      highlight: function(code, lang) {
        return code; // Highlighted by Prism later
      }
    });

    // Custom alerts mapper: parses "> [!NOTE]" -> HTML callout boxes
    function parseAlerts(html) {
      const alertRegex = /<blockquote>\s*<p>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(?:<br\s*\/?>)?([\s\S]*?)<\/p>\s*<\/blockquote>/gi;
      
      const iconMap = {
        NOTE: 'info',
        TIP: 'sparkles',
        IMPORTANT: 'alert-circle',
        WARNING: 'alert-triangle',
        CAUTION: 'zap'
      };

      const typeMap = {
        NOTE: 'note',
        TIP: 'tip',
        IMPORTANT: 'note',
        WARNING: 'warning',
        CAUTION: 'danger'
      };

      return html.replace(alertRegex, (match, type, content) => {
        const uType = type.toUpperCase();
        const alertType = typeMap[uType] || 'note';
        const iconName = iconMap[uType] || 'info';
        
        return `
          <div class="alert alert-${alertType}">
            <i data-lucide="${iconName}" class="alert-icon"></i>
            <div class="alert-body">
              <strong>${uType}</strong>
              <p>${content.trim()}</p>
            </div>
          </div>
        `;
      });
    }

    // Toggle Sidebar on Mobile
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    hamburger.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // Close sidebar on page change for mobile
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 900 && !sidebar.contains(e.target) && e.target !== hamburger && !hamburger.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    });

    // Theme Toggle
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');
    const htmlEl = document.documentElement;

    // Load theme setting
    if (localStorage.getItem('theme') === 'light') {
      htmlEl.classList.remove('dark');
      htmlEl.classList.add('light');
      sunIcon.style.display = 'none';
      moonIcon.style.display = 'block';
    }

    themeToggle.addEventListener('click', () => {
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
        localStorage.setItem('theme', 'light');
      } else {
        htmlEl.classList.remove('light');
        htmlEl.classList.add('dark');
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
        localStorage.setItem('theme', 'dark');
      }
    });

    // Fetch Navigation and Page Content
    async function init() {
      try {
        const res = await fetch('content/nav.json');
        navData = await res.json();
        
        // Build flat list of all pages
        allPages = [];
        navData.forEach(group => {
          group.pages.forEach(p => {
            allPages.push({
              ...p,
              group: group.group
            });
          });
        });

        renderSidebar();
        
        // Handle initial routing based on hash, or load first page
        const initialHash = window.location.hash.slice(1);
        const matchPage = allPages.find(p => p.file === initialHash);
        if (matchPage) {
          loadPage(matchPage.file);
        } else if (allPages.length > 0) {
          loadPage(allPages[0].file);
        }
      } catch (err) {
        console.error("Failed to load documentation config:", err);
        document.getElementById('doc-content').innerHTML = `
          <h1>Error Loading Docs</h1>
          <p>Could not retrieve the documentation config files. Please make sure content/nav.json exists.</p>
        `;
      }
    }

    // Render left navigation menu
    function renderSidebar() {
      const navMenu = document.getElementById('nav-menu');
      navMenu.innerHTML = '';

      navData.forEach(group => {
        const groupEl = document.createElement('div');
        
        const titleEl = document.createElement('h3');
        titleEl.className = 'nav-group-title';
        titleEl.textContent = group.group;
        groupEl.appendChild(titleEl);

        const listEl = document.createElement('ul');
        listEl.className = 'nav-list';

        group.pages.forEach(page => {
          const itemEl = document.createElement('li');
          itemEl.className = `nav-item ${page.file === currentPageFile ? 'active' : ''}`;
          itemEl.id = `nav-${page.file.replace(/\./g, '-')}`;

          const linkEl = document.createElement('a');
          linkEl.href = `#${page.file}`;
          linkEl.innerHTML = `
            <i data-lucide="file-text" style="width:14px;height:14px;"></i>
            <span>${page.title}</span>
          `;
          
          linkEl.addEventListener('click', (e) => {
            e.preventDefault();
            loadPage(page.file);
          });

          itemEl.appendChild(linkEl);
          listEl.appendChild(itemEl);
        });

        groupEl.appendChild(listEl);
        navMenu.appendChild(groupEl);
      });
      lucide.createIcons();
    }

    // Load content dynamically
    async function loadPage(file) {
      if (!file) return;
      currentPageFile = file;
      window.location.hash = file;

      const docContent = document.getElementById('doc-content');
      docContent.style.opacity = '0.3';

      try {
        const res = await fetch(`content/${file}`);
        if (!res.ok) throw new Error(`Status ${res.status}`);
        
        let markdown = await res.text();
        
        // Render markdown
        let htmlContent = marked.parse(markdown);
        htmlContent = parseAlerts(htmlContent);
        
        docContent.innerHTML = htmlContent;
        docContent.style.opacity = '1';

        // Update active class in sidebar
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        const activeNavEl = document.getElementById(`nav-${file.replace(/\./g, '-')}`);
        if (activeNavEl) activeNavEl.classList.add('active');

        // Update breadcrumb
        const pageMeta = allPages.find(p => p.file === file);
        if (pageMeta) {
          document.getElementById('breadcrumb-current').textContent = pageMeta.title;
        }

        // Apply syntax highlighting
        Prism.highlightAllUnder(docContent);

        // Add copy buttons to pre blocks
        document.querySelectorAll('.doc-content pre').forEach(preBlock => {
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.innerHTML = '<i data-lucide="copy" style="width:12px;height:12px;"></i>Copy';
          preBlock.appendChild(btn);

          btn.addEventListener('click', () => {
            const codeText = preBlock.querySelector('code').innerText;
            navigator.clipboard.writeText(codeText).then(() => {
              btn.innerHTML = '<i data-lucide="check" style="width:12px;height:12px;color:#10b981;"></i>Copied!';
              setTimeout(() => {
                btn.innerHTML = '<i data-lucide="copy" style="width:12px;height:12px;"></i>Copy';
                lucide.createIcons();
              }, 2000);
              lucide.createIcons();
            });
          });
        });

        updatePageNavigation(file);
        lucide.createIcons();
      } catch (err) {
        console.error(`Failed to load page content/${file}:`, err);
        docContent.innerHTML = `
          <h1>Page Not Found</h1>
          <p>Could not fetch the document content for <code>${file}</code>. Check if the file is correctly stored under /docs/content/.</p>
        `;
        docContent.style.opacity = '1';
      }
    }

    // Update Next/Previous cards
    function updatePageNavigation(file) {
      const idx = allPages.findIndex(p => p.file === file);
      const prevCard = document.getElementById('prev-card');
      const nextCard = document.getElementById('next-card');

      if (idx > 0) {
        const prevPage = allPages[idx - 1];
        prevCard.style.display = 'flex';
        document.getElementById('prev-title').textContent = prevPage.title;
        prevCard.onclick = (e) => { e.preventDefault(); loadPage(prevPage.file); };
      } else {
        prevCard.style.display = 'none';
      }

      if (idx !== -1 && idx < allPages.length - 1) {
        const nextPage = allPages[idx + 1];
        nextCard.style.display = 'flex';
        document.getElementById('next-title').textContent = nextPage.title;
        nextCard.onclick = (e) => { e.preventDefault(); loadPage(nextPage.file); };
      } else {
        nextCard.style.display = 'none';
      }
    }

    // Search Engine
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    searchInput.addEventListener('input', async (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        searchResults.style.display = 'none';
        return;
      }

      const results = allPages.filter(p => p.title.toLowerCase().includes(q));
      
      if (results.length > 0) {
        searchResults.innerHTML = results.map(p => `
          <div class="search-result-item" onclick="selectResult('${p.file}')">
            <div class="search-result-title">${p.title}</div>
            <div class="search-result-snippet">${p.group}</div>
          </div>
        `).join('');
        searchResults.style.display = 'block';
      } else {
        searchResults.innerHTML = '<div style="padding:12px;color:var(--text-muted);font-size:12px;">No results found</div>';
        searchResults.style.display = 'block';
      }
    });

    // Close search overlay on click outside
    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
      }
    });

    function selectResult(file) {
      loadPage(file);
      searchInput.value = '';
      searchResults.style.display = 'none';
    }

    // Listen to hash changes for browser history back/forward buttons
    window.addEventListener('hashchange', () => {
      const file = window.location.hash.slice(1);
      if (file && file !== currentPageFile) {
        loadPage(file);
      }
    });

    // Start App
    init();
  </script>
</body>
</html>
