<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELLA — Loop Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js">
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<style>
:root{--ink:#1f1b16;--paper:#fbf7ef;--paper2:#f3ecdf;--green:#3aa655;--green-dk:#23682f;--green-soft:#e6f3e9;
--amber:#c8861a;--amber-soft:#faf0d9;--purple:#5b50c4;--purple-soft:#ecebfb;--blue:#2f6fb0;--blue-soft:#e6f0f9;
--rust:#b8472f;--rule:#d8cfbe;--grey:#8a8678;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper2);color:var(--ink);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:1fr 1fr;gap:0;height:100vh;max-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto;max-height:none}}
.col{display:flex;flex-direction:column;height:100vh;overflow:hidden}
@media(max-width:900px){.col{height:auto;min-height:90vh}}
.left{background:#eaf4ff;border-right:2px solid var(--ink)}
.right{background:var(--paper)}
.bar{padding:10px 14px;border-bottom:2px solid var(--ink);background:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.bar h2{font-size:14px;font-weight:700}
.bar .sp{flex:1}
select,button{font-family:inherit;font-size:12px}
button.act{background:var(--green);color:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
button.act:active{transform:translate(2px,2px);box-shadow:none}
button.act:disabled{opacity:.5;cursor:default}
button.ghost{background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600}
.modeToggle{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.modeToggle button{padding:5px 10px;background:#fff;border:none;cursor:pointer;font-weight:600;font-size:11px}
.modeToggle button.on{background:var(--purple);color:#fff}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;padding:9px 13px;border:2px solid var(--ink);border-radius:14px;font-size:14px;line-height:1.4;box-shadow:2px 2px 0 var(--ink)}
.bub.zoe{background:#fff;align-self:flex-start;border-bottom-left-radius:3px}
.bub.me{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.bub.sys{align-self:center;background:var(--amber-soft);border-style:dashed;font-size:12px;color:#7a5a13;max-width:90%;text-align:center}
.inrow{padding:10px;border-top:2px solid var(--ink);background:#fff;display:flex;gap:8px;flex:none;flex-wrap:wrap}
.inrow input{flex:1;min-width:120px;padding:9px 12px;border:1.5px solid var(--ink);border-radius:8px;font-size:14px}
.tabs{display:flex;gap:4px;padding:8px 10px 0;flex-wrap:wrap;flex:none;background:var(--paper)}
.tab{font-size:11px;font-weight:600;padding:5px 9px;border:1.5px solid var(--ink);border-bottom:none;border-radius:7px 7px 0 0;background:var(--paper2);cursor:pointer}
.tab.on{background:#fff}
.panel{flex:1;overflow-y:auto;padding:14px;background:#fff;border-top:1.5px solid var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.k{color:var(--purple);font-weight:600}
.lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--rust);margin:14px 0 5px}
.lbl:first-child{margin-top:0}
.skill{display:flex;align-items:flex-start;gap:7px;padding:4px 6px;border-radius:5px;font-size:12px;margin-bottom:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
.d-locked{background:#cfc8bb}.d-emerging{background:var(--amber)}.d-owned{background:var(--green)}
.chg{background:var(--green-soft);border:1px solid var(--green);border-radius:6px;padding:6px 9px;margin-bottom:5px;font-size:12px}
.ev{border:1px solid var(--rule);border-radius:7px;padding:8px 10px;margin-bottom:7px;font-size:12px}
.ev .id{font-family:monospace;font-weight:700;font-size:11px}
.ev .conf{float:right;font-weight:700}
.ev .nm{display:block;margin-top:2px;color:#4a443c}
.confbar{height:5px;background:#eee;border-radius:3px;margin-top:5px;overflow:hidden}
.confbar i{display:block;height:100%;background:var(--green)}
.due{border:1.5px solid var(--ink);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px;background:var(--blue-soft)}
.due .b{font-size:10px;font-weight:700;color:var(--blue);text-transform:uppercase}
textarea{width:100%;min-height:150px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5;padding:10px;border:1.5px solid var(--ink);border-radius:8px;resize:vertical}
.hist{font-size:11px;border-bottom:1px solid var(--rule);padding:7px 0}
.hist b{font-family:monospace}
.warn{background:var(--amber-soft);border:1.5px dashed var(--amber);border-radius:8px;padding:8px 11px;font-size:11.5px;margin-bottom:10px;color:#7a5a13}
.statline{font-size:11px;color:var(--grey);padding:4px 14px;background:var(--paper);border-bottom:1px solid var(--rule);flex:none}
.memfield{margin-bottom:3px}
.hl{background:#fff6cc;border-radius:3px;transition:background .1s}
small.note{display:block;color:var(--grey);font-size:10.5px;margin-top:6px}
.unit{border:1.5px solid var(--ink);border-radius:10px;margin-bottom:10px;overflow:hidden}
.unit .uh{padding:8px 11px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.unit.active .uh{background:var(--blue);color:#fff}
.unit.done .uh{background:var(--green);color:#fff}
.unit.locked .uh{background:var(--paper2);color:var(--grey)}
.unit .ub{padding:8px 11px;background:#fff}
.ubar{height:7px;background:#eee;border-radius:4px;overflow:hidden;margin:4px 0 8px}
.ubar i{display:block;height:100%;background:var(--green)}
.hit{color:var(--green-dk);font-weight:700}.miss{color:var(--rust);font-weight:700}
</style>
</head>

an use words to describe past events and experiences."], ["A2-VOC-03", "A2", "VOC", "I can use opinion words — I think, I feel, I believe, in my opinion."], ["A2-VOC-04", "A2", "VOC", "I can use linking words — and, but, because, so, then."], ["A2-VOC-05", "A2", "VOC", "I can understand and use common phrases in conversation."], ["A2-VOC-06", "A2", "VOC", "I have enough words to talk about everyday topics and express how I feel."], ["A2-VOC-07", "A2", "VOC", "I can use words for feelings — excited, nervous, proud, bored."], ["A2-GRA-01", "A2", "GRA", "I can talk about the past using past simple — I went, I ate, I saw."], ["A2-GRA-02", "A2", "GRA", "I can use 'going to' to talk about future plans."], ["A2-GRA-03", "A2", "GRA", "I can use comparative adjectives — bigger, faster, more interesting."], ["A2-GRA-04", "A2", "GRA", "I can use 'can' and 'can't' to talk about ability."], ["A2-GRA-05", "A2", "GRA", "I can use 'should' to give simple advice."], ["A2-GRA-06", "A2", "GRA", "I can use 'there is' and 'there are' to describe places."], ["A2-GRA-07", "A2", "GRA", "I can ask questions using who, what, where, when, and why."], ["A2-FLU-01", "A2", "FLU", "I can hold a short conversation on familiar topics without long silences."], ["A2-FLU-02", "A2", "FLU", "I can understand the main point even when I don't catch every word."], ["A2-FLU-03", "A2", "FLU", "I can use simple phrases to buy time — 'let me think', 'I mean'."], ["A2-FLU-04", "A2", "FLU", "I can repair a conversation when I make a mistake."], ["A2-FLU-05", "A2", "FLU", "I can speak at a slow but steady pace on topics I know well."], ["A2-FLU-06", "A2", "FLU", "I can talk about my daily life, interests, and opinions — and it feels like a real conversation."], ["B1-VOC-01", "B1", "VOC", "I can discuss topics like health, education, and technology in simple terms."], ["B1-VOC-02", "B1", "VOC", "I can use more specific words to make my ideas clearer — not just 'nice' but 'generous', not just 'said' but 'explained' ss, culture."], ["B2-VOC-02", "B2", "VOC", "I can use a wide range of vocabulary including less common words."], ["B2-VOC-03", "B2", "VOC", "I can use idiomatic language naturally without it sounding forced."], ["B2-VOC-04", "B2", "VOC", "I can choose precise words to say exactly what I mean."], ["B2-VOC-05", "B2", "VOC", "I can understand vocabulary in context even if I haven't seen it before."], ["B2-VOC-06", "B2", "VOC", "I have a wide vocabulary that lets me say what I mean, even on complex topics."], ["B2-VOC-07", "B2", "VOC", "I can use different registers — casual with friends, formal in a debate."], ["B2-GRA-01", "B2", "GRA", "I can use a wide range of tenses accurately in extended speech."], ["B2-GRA-02", "B2", "GRA", "I can use complex conditionals — If I had studied, I would have passed."], ["B2-GRA-03", "B2", "GRA", "I can use reported speech — She said that she would come."], ["B2-GRA-04", "B2", "GRA", "I can use a range of linking devices to build clear, structured arguments."], ["B2-GRA-05", "B2", "GRA", "I can use passive and active voice flexibly depending on emphasis."], ["B2-GRA-06", "B2", "GRA", "I can use cleft sentences for emphasis — What I mean is… It was she who…"], ["B2-GRA-07", "B2", "GRA", "I make grammar mistakes occasionally but they rarely affect understanding."], ["B2-FLU-01", "B2", "FLU", "I can speak naturally and at a comfortable pace without noticeable effort."], ["B2-FLU-02", "B2", "FLU", "I can handle interruptions and unexpected questions without losing my thread."], ["B2-FLU-03", "B2", "FLU", "I can argue, persuade, and negotiate in English with confidence."], ["B2-FLU-04", "B2", "FLU", "I can understand fast, natural speech including different accents."], ["B2-FLU-05", "B2", "FLU", "I can pick up on tone and emotion — sarcasm, humour, frustration — in conversation."], ["B2-FLU-06", "B2", "FLU", "I can recover from mistakes smoothly without the conversation breaking down."], ["B2-FLU-07", "B2", "FLU", "I can express who I am in English — my personality, my opinions, my sense of humour."], ["C1-VOC-01", "C1", "VOC", "I can use a wide range of vocabulary to give and exchange views — on familiar topics and unfamiliar ones."], ["C1-VOC-02", "C1", "VOC", "I can use abstract and less common vocabulary naturally — words like 'empathetic', 'burden', 'asset', 'cycle of life' come up in my speech without effort."], ["C1-VOC-03", "C1", "VOC", "I can choose words precisely — I know the difference between near-synonyms and pick the one that fits the moment."], ["C1-VOC-04", "C1", "VOC", "I can use vocabulary to convey my attitude and point of view, not just the facts — my word choice reflects how I feel about what I'm saying."], ["C1-VOC-05", "C1", "VOC", "I can shift between formal and informal language naturally, depending on who I'm speaking to and what the situation calls for."], ["C1-VOC-06", "C1", "VOC", "I have the vocabulary I need for any topic I want to talk about — and I can always find a way to say exactly what I mean."], ["C1-VOC-07", "C1", "VOC", "I sometimes choose a word that isn't quite right, but it rarely gets in the way — I always find a way to get my meaning across."], ["C1-GRA-01", "C1", "GRA", "I can use a wide range of grammatical structures with confidence — complex sentences, passive forms, participle clauses, and more."], ["C1-GRA-02", "C1", "GRA", "I can use modal verbs accurately to speculate, deduce, and express criticism — 'it must have been', 'she could have known', 'they should have acted'."], ["C1-GRA-03", "C1", "GRA", "I can use discourse markers and cohesive devices to organise and connect what I say — my speech flows naturally and is easy for the listener to follow."], ["C1-GRA-04", "C1", "GRA", "I can express complex ideas concisely — I don't just describe things, I can name them precisely and build on them."], ["C1-GRA-05", "C1", "GRA", "I can use conditional and hypothetical structures accurately across different tenses — I make occasional minor errors but they <script type="text/babel" data-presets="react">

const SKILLS = CAT.map(r=>({id:r[0],level:r[1],strand:r[2],text:r[3]}));
const byLevel = lvl => SKILLS.filter(s=>s.level===lvl);
const STRANDS={VOC:'Vocabulary',GRA:'Grammar',FLU:'Fluency'};

const UNIT_SKILLS={};
UNITS_A1.forEach(u=>u.skills.forEach(s=>{UNIT_SKILLS[s.id]={...s,step:u.step,stepName:u.name};}));
function skillText(id){

  if(UNIT_SKILLS[id])return UNIT_SKILLS[id].text;
  return id;
}

const DEFAULT_PROMPTS = {
  base:
`You are Zoe, a warm, encouraging AI English tutor for a language-learning app.
You are a friendly green backpack character with round glasses.
ABSOLUTE RULES (never break, any level):
- Never criticise. Never make the learner feel bad. Any attempt counts.
- Keep your turns short and natural. One question at a time.
- Speak only in English unless the learner is clearly stuck.

  profileA1:
`LEVEL: A1 (First Words). Your role: CARRIER — you carry the conversation.
- Use very simple present-simple sentences and high-frequency words.
- Ask binary or single-word-answer questions. A one-word answer is a success.

- Offer a simpler version if the learner goes quiet.
- ESCALATE: once the learner answers, MOVE ON to a new topic or a slightly harder

{{TARGETS}}

Steer the whole conversation around this theme so the learner naturally practises it.

{{TARGETS}}

  judge:
`You are an examiner scoring a language-learning conversation. You will be given:
the learner's level, a list of target "I can" skills (with IDs), and the transcript.

For EACH skill in the list, output STRICT JSON only (no prose):
{"scores":[{"id":"<id>","confidence":<0..1>,"prompted":<bool>,"evidence":"<short quote or ''>"}]}

RULES:
- confidence 0..1 = strength of evidence in the transcript.
- These thresholds matter downstream: >=0.7 means the learner OWNS it; 0.3-0.69 = emerging; <0.3 = ignored.
- FORCED COMMIT: if you see real evidence, commit >=0.7. Do not hedge at 0.5. 0.5 is only genuine ambiguity.
- Reward EFFORT not accuracy: a wrong-but-trying attempt that shows the skill still scores.
- prompted=true if Zoe set them up to do it; false if spontaneous.
- evidence = short direct learner quote, or "".
Output JSON only.`
};

// ---------- engine ----------
const FLOOR=0.3;
// ownership bar SCALES with level: a beginner owns by being understood; advanced by being accurate
const OWN_BAR={A1:0.55,A2:0.60,B1:0.68,B2:0.72,C1:0.75,C2:0.78};
const SIGHTINGS_TO_OWN=2;   // corroboration: need >=2 qualifying sightings (across chats) to own
function ownBar(level){ return OWN_BAR[level]||0.7; }
function bucketOf(mem,id){ if(mem.owned.includes(id))return'owned'; if(mem.emerging.includes(id))return'emerging'; return'locked'; }
function strandOf(id){ const s=SKILLS.find(x=>x.id===id); if(s)return s.strand; if(UNIT_SKILLS[id])return UNIT_SKILLS[id].strand; return 'VOC'; }

function applyMerge(mem, scores, level){
  const m=JSON.parse(JSON.stringify(mem)); const changes=[];
  scores.forEach(sc=>{
    const prior=bucketOf(m,sc.id); let next=prior;
    const qualifies = sc.confidence>=ownBar(level);   // a "qualifying sighting"
    // count sightings + effort
    if(sc.confidence>=FLOOR){
      m.last_seen[sc.id]=new Date().toISOString().slice(0,10);
      if(qualifies) m.sightings[sc.id]=(m.sightings[sc.id]||0)+1;
      if(!sc.prompted) m.strength[sc.id]=(m.strength[sc.id]||0)+1;
    }
    const sightings=m.sightings[sc.id]||0;
    // promotion needs corroboration: >=SIGHTINGS_TO_OWN qualifying sightings,
    // OR effort path at low levels (3 honest attempts even if not all qualifying)
    const effortPath = (level==='A1'||level==='A2') && (m.strength[sc.id]||0)+ (m.sightings[sc.id]||0) >=3 && sc.confidence>=FLOOR;
    if(sc.confidence<FLOOR){ next=prior; }
    else if(prior==='locked'){ next='emerging'; }
    else if(prior==='emerging' && (sightings>=SIGHTINGS_TO_OWN || effortPath)){ next='owned'; }
    if(next!==prior){
      changes.push({id:sc.id,from:prior,to:next});
      if(prior==='locked') m.emerging.push(sc.id);
      if(prior==='emerging' && next==='owned'){ m.emerging=m.emerging.filter(x=>x!==sc.id); m.owned.push(sc.id); }
    }
  });
  return {mem:m,changes};
}

// ----- due_next: ONE primary + a small watch-list (judge also scores adjacent/spontaneous skills) -----
function dueSkill(mem, level){
  const lvl=byLevel(level).map(s=>s.id); const picks=[]; const why=[];
  const em=mem.emerging.find(id=>lvl.includes(id)); if(em){picks.push(em);why.push('finish what is started (emerging)');}
  const so={VOC:0,GRA:0,FLU:0}; mem.owned.forEach(id=>{const s=SKILLS.find(x=>x.id===id);if(s&&s.level===level)so[s.strand]++;});
  const order=Object.keys(so).sort((a,b)=>so[a]-so[b]);
  for(const st of order){ const n=byLevel(level).find(s=>s.strand===st&&bucketOf(mem,s.id)==='locked'&&!picks.includes(s.id)); if(n){picks.push(n.id);why.push('open weakest strand: '+STRANDS[st]);break;} }
  const fav=mem.owned.find(id=>lvl.includes(id)&&!picks.includes(id)); if(fav){picks.push(fav);why.push('familiar favourite (owned)');}
  return picks.map((id,i)=>({id,why:why[i]}));
}
function activeStep(mem){
  for(const u of UNITS_A1){ if(!unitComplete(mem,u)) return u; }
  return null;
}
// COMMUNICATE-TO-ADVANCE gate: a unit completes when its FLU+VOC skills are owned
// AND its GRA skills are at least emerging (attempted, not locked). Grammar matures later.
function unitComplete(mem,u){
  for(const s of u.skills){
    const b=bucketOf(mem,s.id);
    if((s.strand==='FLU'||s.strand==='VOC') && b!=='owned') return false;
    if(s.strand==='GRA' && b==='locked') return false; // must be at least emerging
  }
  return true;
}
function dueUnit(mem){
  const u=activeStep(mem); if(!u)return {step:null,picks:[]};
  // primary = first unowned FLU/VOC (the communicative core), then unowned grammar
  const order=u.skills.slice().sort((a,b)=>{
    const rank=x=> x.strand==='GRA'?2 : x.strand==='FLU'?0:1; return rank(a)-rank(b);
  });
  const picks=order.filter(s=>bucketOf(mem,s.id)!=='owned').map(s=>({id:s.id,why:'unit "'+u.name+'" · '+s.strand}));
  return {step:u,picks};
}
function stepProgress(mem,u){ const owned=u.skills.filter(s=>mem.owned.includes(s.id)).length; return {owned,total:u.skills.length}; }

// ----- topic layer: pick a fresh topic for the target skill, avoiding recent ones -----
function pickTopic(mem){
  const bank=TOPICS[mem.level]||TOPICS['A1']||[];
  if(!bank.length) return null;
  const recent=mem.last_topics||[];
  const fresh=bank.filter(t=>!recent.includes(t.topic));
  const pool=fresh.length?fresh:bank; // if all used recently, allow reuse
  // prefer a topic whose theme words overlap interests (very light heuristic)
  const intr=(mem.interests||'').toLowerCase();
  let pick=pool.find(t=>intr && (intr.includes(t.topic.toLowerCase().split(' ')[0]) || (t.theme&&intr.includes(t.theme.toLowerCase()))));
  if(!pick) pick=pool[Math.floor(Math.random()*pool.length)];
  return pick;
}

function freshMemory(level){ return {
  child_id:'demo_child', name:'', age:null, grade:null, home_language:'Hindi',
  level, active_unit:null, owned:[], emerging:[],
  due_next:{primary:null,watching:[]},
  last_topics:[], interests:'',
  effort:{times_spoken_total:0}, sightings:{}, strength:{}, last_seen:{}, updated_after_chat:0 }; }

const LLM_CONFIG = {
  mode:'runtime',          // 'runtime' | 'direct' | 'proxy'
  proxyUrl:'',             // e.g. http://localhost:8000/complete
  // per-role provider settings
  conv:  { provider:'openrouter', model:'', key:'' },
  judge: { provider:'openrouter', model:'', key:'' }
};
// OpenAI-compatible base URLs (used in 'direct' mode)
const PROVIDER_URLS = {
  openrouter:'https://openrouter.ai/api/v1/chat/completions',
  deepseek:'https://api.deepseek.com/chat/completions',
  openai:'https://api.openai.com/v1/chat/completions',
  custom:'' // user pastes full URL into model field as "URL||model"
};
async function callLLM(prompt, role){
  role = role||'conv';
  const cfg = LLM_CONFIG[role] || LLM_CONFIG.conv;
  // 1) runtime (Claude.ai artifact channel) — default, works only inside Claude.ai
  if(LLM_CONFIG.mode==='runtime'){
    try{ if(window.claude && window.claude.complete){ const r=await window.claude.complete(prompt); return {ok:true,text:r}; } }
    catch(e){ return {ok:false,text:'',err:String(e)}; }
    return {ok:false,text:'',err:'runtime channel unavailable (open inside Claude.ai, or switch mode in ⚙︎)'};
  }
  // build an OpenAI-compatible request body
  const body = JSON.stringify({ model:cfg.model||'', messages:[{role:'user',content:prompt}], temperature:0.7, max_tokens:1000 });
  // 2) proxy — your backend holds the key; works for ALL providers
  if(LLM_CONFIG.mode==='proxy'){
    try{
      const r=await fetch(LLM_CONFIG.proxyUrl,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({role,provider:cfg.provider,model:cfg.model,prompt})});
      if(!r.ok) return {ok:false,text:'',err:'proxy '+r.status};
      const j=await r.json(); return {ok:true,text:j.text||j.completion||''};
    }catch(e){ return {ok:false,text:'',err:'proxy unreachable: '+e}; }
  }
  // 3) direct browser → provider (works only for CORS-permissive providers, e.g. OpenRouter)
  try{
    const url=PROVIDER_URLS[cfg.provider]||cfg.provider;
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body});
    if(!r.ok){ const t=await r.text(); return {ok:false,text:'',err:'HTTP '+r.status+' '+t.slice(0,120)}; }
    const j=await r.json();
    const txt=j.choices&&j.choices[0]&&j.choices[0].message?j.choices[0].message.content:'';
    return {ok:true,text:txt};
  }catch(e){ return {ok:false,text:'',err:'direct call blocked (likely CORS): '+e}; }
}
const MOCK_KID=['My name is Priya.','I am eleven.','Yes, one sister. Her name Anjali.','I like cricket and she like dancing.','Because it is fun.','Yesterday I go to school.'];


function App(){
  const [model,setModel]=useState('skill'); // 'skill' | 'unit'
  const [level,setLevel]=useState('A1');
  const [mem,setMem]=useState(()=>freshMemory('A1'));
  const [prompts,setPrompts]=useState(DEFAULT_PROMPTS);
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [busy,setBusy]=useState(false);
  const [tab,setTab]=useState('readme');
  const [judgeOut,setJudgeOut]=useState(null);
  const [dualJudge,setDualJudge]=useState(null); // {skill:[],unit:[]}
  const [changes,setChanges]=useState([]);
  const [history,setHistory]=useState([]);
  const [sessions,setSessions]=useState([]);
  const [snapshots,setSnapshots]=useState([]); // memory after each chat
  const [auto,setAuto]=useState(false);
  const [chatNum,setChatNum]=useState(1);
  const [turnCount,setTurnCount]=useState(0);
  const [hl,setHl]=useState({});
  const [llmLive,setLlmLive]=useState(null);
  const chatRef=useRef(); const autoStep=useRef(0);
  useEffect(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},[msgs]);

  function profileFor(lvl){ return (lvl==='A1'||lvl==='A2')?prompts.profileA1:prompts.profileB1; }
  function targetsList(){ return flatTargets(mem); }
  function buildConvPrompt(curMsgs){
    const flat=flatTargets(mem);
    const primary=flat[0]; const watching=flat.slice(1);
    const topic=mem._topic; // chosen at chat start
    const primaryLine = primary? ('PRIMARY skill to steer toward: '+primary+' — '+skillText(primary)) : 'PRIMARY: keep them talking';
    const watchLine = watching.length? ('\nAlso fine if these come up: '+watching.map(id=>id+' ('+skillText(id)+')').join('; ')) : '';
    const topicLine = topic? ('\nTODAY\u2019S TOPIC: "'+topic.topic+'" ('+topic.theme+'). Openers you can adapt: '+topic.starters) : '';
    let frame;
    if(model==='unit'){ const u=activeStep(mem);
      frame=prompts.convUnit.replace('{{UNITNAME}}',u?u.name:'(complete)').replace('{{UNITFOCUS}}',u?u.focus:'').replace('{{TARGETS}}',primaryLine+watchLine);
    } else { frame=prompts.convSkill.replace('{{TARGETS}}',primaryLine+watchLine); }
    const convo=curMsgs.filter(m=>m.role!=='sys').map(m=>(m.role==='zoe'?'Zoe: ':'Learner: ')+m.text).join('\n');
    return `${prompts.base}\n\n${profileFor(level)}\n\n${frame}${topicLine}\n${mem.interests?('\nLEARNER INTERESTS: '+mem.interests):''}${(mem.last_topics&&mem.last_topics.length)?('\nRECENT TOPICS (avoid repeating): '+mem.last_topics.join(', ')):''}\n\nCONVERSATION SO FAR:\n${convo||'(none — you open)'}\n\nReply with ONLY Zoe's next short spoken turn.`;
  }
  async function zoeOpens(){
    setBusy(true);
    // choose a fresh topic for this chat (anti-repetition via last_topics)
    const topic=pickTopic(mem);
    if(topic){ mem._topic=topic; }
    const r=await callLLM(buildConvPrompt([]),"conv"); setLlmLive(r.ok);
    setMsgs([{role:'sys',text:'Chat '+chatNum+' — '+model+' mode — '+level+(topic?(' — topic: '+topic.topic):'')},{role:'zoe',text:r.ok?r.text.trim():"Hi! I'm Zoe. What's your name?"}]); setBusy(false); }

  useEffect(()=>{ const nm=freshMemory(level); const dn=targetsListFor(nm); nm.due_next=dn; setMem(nm); setTimeout(()=>zoeOpens(),60); },[]); // eslint-disable-line
  function targetsListFor(m){
    let picks;
    if(model==='unit'){ picks=dueUnit(m).picks.map(p=>p.id); }
    else { picks=dueSkill(m,level).map(d=>d.id); }
    return { primary: picks[0]||null, watching: picks.slice(1) };
  }
  function flatTargets(m){ const d=(m&&m.due_next&&m.due_next.primary!==undefined)?m.due_next:targetsListFor(m||mem); return [d.primary,...(d.watching||[])].filter(Boolean); }

  async function sendKid(text){
    if(!text.trim()||busy)return;
    const nm=[...msgs,{role:'me',text}]; setMsgs(nm); setInput(''); setTurnCount(c=>c+1); setBusy(true);
    const r=await callLLM(buildConvPrompt(nm),"conv"); setLlmLive(r.ok);
    setMsgs(m=>[...m,{role:'zoe',text:r.ok?r.text.trim():mockZoe(nm.length)}]); setBusy(false);
  }
  function mockZoe(n){const o=["Nice! Tell me more.","Lovely! And what else?","Why is that?","Who do you do that with?","How do you feel about it?"];return o[n%o.length];}

  async function mockKidLLM(){
    const last=[...msgs].reverse().find(m=>m.role==='zoe');
    const convo=msgs.filter(m=>m.role!=='sys').map(m=>(m.role==='zoe'?'Zoe: ':'Me: ')+m.text).join('\n');
    const desc=level==='A1'?'a beginner who speaks in very short, broken sentences, sometimes one word, with mistakes and occasional Hinglish'
      :level==='A2'?'an elementary learner managing 2-3 simple sentences with errors':'a '+level+' learner, fairly fluent with occasional mistakes';
    const p=`You are role-playing a LANGUAGE LEARNER (not the tutor). You are ${desc}. Reply ONLY as the learner — short, imperfect, realistic, with natural mistakes for your level. Do not explain.\n\nConversation:\n${convo}\n\nTutor just said: "${last?last.text:'(opening)'}"\nYour short learner reply:`;
    const r=await callLLM(p,"conv"); if(r.ok)return r.text.trim().replace(/^(Me:|Learner:)\s*/i,''); return MOCK_KID[autoStep.current%MOCK_KID.length];
  }
  async function autoTurn(){ if(busy)return; if(autoStep.current>=6){await endChat();return;} setBusy(true); const k=await mockKidLLM(); setBusy(false); autoStep.current++; await sendKid(k); }

  async function runJudge(skillIds){
    const idList=skillIds.map(id=>'- '+id+': '+skillText(id)).join('\n');
    const convo=msgs.filter(m=>m.role!=='sys').map(m=>(m.role==='zoe'?'Zoe: ':'Learner: ')+m.text).join('\n');
    const jp=`${prompts.judge}\n\nLEARNER LEVEL: ${level}\n\nTARGET SKILLS:\n${idList}\n\nTRANSCRIPT:\n${convo}`;
    const r=await callLLM(jp,"judge"); setLlmLive(r.ok);
    if(r.ok){ try{ return JSON.parse(r.text.replace(/```json|```/g,'').trim()).scores||[]; }catch(e){} }
    return skillIds.map((id,i)=>({id,confidence:i===0?0.8:(i===1?0.55:0.4),prompted:i>0,evidence:'(mock)'}));
  }

  async function endChat(){
    if(busy)return; setBusy(true);
    setMsgs(m=>[...m,{role:'sys',text:'Chat ended — judging both models…'}]);
    // primary model skills
    const primaryIds = model==='unit'
      ? Array.from(new Set([...targetsList(), ...mem.emerging.filter(id=>UNIT_SKILLS[id])]))
      : Array.from(new Set([...targetsList(), ...mem.emerging.filter(id=>id.startsWith(level))]));
    const primaryScores = await runJudge(primaryIds);
    // side-by-side: judge the OTHER model's skill framing on the same transcript
    let otherScores=null, otherLabel='';
    if(model==='skill'){ // also judge units skills
      const uids=UNITS_A1.flatMap(u=>u.skills.map(s=>s.id)).slice(0,8); otherScores=await runJudge(uids); otherLabel='units';
    } else { // also judge flat A1 skills
      const sids=byLevel('A1').slice(0,8).map(s=>s.id); otherScores=await runJudge(sids); otherLabel='micro-skill';
    }
    setJudgeOut(primaryScores);
    setDualJudge({primary:{label:model,scores:primaryScores},other:{label:otherLabel,scores:otherScores}});
    // did-we-hit-targets readout
    const aimed=targetsList();
    const hit=aimed.filter(id=>primaryScores.find(s=>s.id===id && s.confidence>=FLOOR));
    // merge (level-scaled bar + sightings)
    const {mem:merged,changes:chg}=applyMerge(mem,primaryScores,level);
    merged.effort.times_spoken_total+=turnCount; merged.updated_after_chat=chatNum;
    // record the topic just used so it isn't repeated next chats
    if(mem._topic){ merged.last_topics=[mem._topic.topic, ...(merged.last_topics||[])].slice(0,5); }
    merged.due_next=targetsListFor(merged);
    setChanges(chg);
    setHl({owned:true,emerging:true,due_next:true,effort:true}); setTimeout(()=>setHl({}),1400);
    setMem(merged);
    setSnapshots(prev=>[...prev,{chat:chatNum,model,owned:[...merged.owned],emerging:[...merged.emerging],due:flatTargets(merged)}]);
    const sLog={session_id:'s_'+String(chatNum).padStart(4,'0'),child_id:mem.child_id,level,progression_model:model,prompt_version:'sim_v4',
      timestamp:new Date().toISOString(),turns_total:turnCount,
      topic: mem._topic? mem._topic.topic : null,
      aimed_at:aimed, hit_targets:hit,
      skills_evidenced:primaryScores.map(s=>({id:s.id,name:skillText(s.id),confidence:s.confidence,prompted:s.prompted,evidence:s.evidence||''})),
      state_changes:chg.map(c=>({...c,name:skillText(c.id)})),
      transcript:msgs.filter(m=>m.role!=='sys').map(m=>({speaker:m.role==='zoe'?'zoe':'learner',text:m.text}))};
    setSessions(p=>[...p,sLog]);
    setHistory(h=>[...h,{chat:chatNum,level,model,owned:merged.owned.length,emerging:merged.emerging.length,changes:chg.length,turns:turnCount,aimed:aimed.length,hit:hit.length}]);
    setMsgs(m=>[...m,{role:'sys',text:(chg.length?('Grew: '+chg.map(c=>c.id+' '+c.from+'→'+c.to).join(', ')):'No state changes')+' · aimed '+aimed.length+', hit '+hit.length}]);
    setBusy(false);
  }

  function nextChat(){ const n=chatNum+1; setChatNum(n); const carried={...mem}; carried.due_next=targetsListFor(carried);
    setMem(carried); setJudgeOut(null);setDualJudge(null);setChanges([]);setTurnCount(0);autoStep.current=0;
    setMsgs([{role:'sys',text:'Chat '+n+' — '+model+' mode'}]); setTimeout(()=>zoeOpens(),60); }
  function resetAll(){ const nm=freshMemory(level); nm.due_next=targetsListFor(nm); setMem(nm);
    setJudgeOut(null);setDualJudge(null);setChanges([]);setHistory([]);setSessions([]);setSnapshots([]);setChatNum(1);setTurnCount(0);autoStep.current=0;
    setTimeout(()=>zoeOpens(),60); }
  function changeLevel(l){ setLevel(l); const nm=freshMemory(l); setMem(nm); setChatNum(1);setHistory([]);setSessions([]);setSnapshots([]);setJudgeOut(null);setDualJudge(null);setChanges([]);setTurnCount(0);
    setMsgs([{role:'sys',text:'Level '+l+' (reset)'}]); setTimeout(()=>{const m2=freshMemory(l);m2.due_next=targetsListFor(m2);setMem(m2);zoeOpens();},60); }
  function changeModel(md){ setModel(md); const nm=freshMemory(level); setMem(nm);setChatNum(1);setHistory([]);setSessions([]);setSnapshots([]);setJudgeOut(null);setDualJudge(null);setChanges([]);setTurnCount(0);
    setMsgs([{role:'sys',text:md+' mode (reset)'}]); setTimeout(()=>{const m2=freshMemory(level);setMem(m2);zoeOpens();},80); }

  return (<div className="app">
    <div className="col left">
      <div className="bar"><h2>📱 Child view</h2><span className="sp"></span>
        <div className="modeToggle">
          <button className={model==='skill'?'on':''} onClick={()=>changeModel('skill')}>micro-skill</button>
          <button className={model==='unit'?'on':''} onClick={()=>changeModel('unit')}>units</button>
        </div>
      </div>
      <div className="statline">Chat #{chatNum} · {model} · {level} · turns: {turnCount} · lifetime talks: {mem.effort.times_spoken_total} · LLM: {llmLive===null?'—':llmLive?'live':'mock'}</div>
      <div className="chat" ref={chatRef}>
        {msgs.map((m,i)=><div key={i} className={'bub '+(m.role==='zoe'?'zoe':m.role==='me'?'me':'sys')}>{m.text}</div>)}
        {busy&&<div className="bub sys">…thinking…</div>}
      </div>
      <div className="inrow">
        <input value={input} placeholder={auto?'auto-mode on':'type as the learner…'} disabled={auto||busy} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')sendKid(input);}}/>
        {!auto&&<button className="act" disabled={busy} onClick={()=>sendKid(input)}>Send</button>}
        {auto&&<button className="act" disabled={busy} onClick={autoTurn}>Next turn ▶</button>}
      </div>
      <div className="inrow" style={{borderTop:'none',paddingTop:0}}>
        <button className="ghost" onClick={()=>setAuto(a=>!a)}>{auto?'✋ manual':'🤖 auto'}</button>
        <button className="act" disabled={busy} onClick={endChat}>End chat & judge ⚖️</button>
        <button className="ghost" disabled={busy} onClick={nextChat}>Next chat →</button>
        <button className="ghost" onClick={resetAll}>Reset</button>
      </div>
    </div>
    <div className="col right">
      <div className="bar"><h2>🔬 Glass box</h2><span className="sp"></span><span style={{fontSize:'11px'}}>level</span>
        <select value={level} onChange={e=>changeLevel(e.target.value)}>{['A1','A2','B1','B2','C1','C2'].map(l=><option key={l}>{l}</option>)}</select>
      </div>
      <div className="tabs">
        {[['readme','📖 Read me'],['memory','🧠 Memory'],['judge','⚖️ Judge'],['dual','⚖️⚖️ Both'],['session','📄 Session'],['due','🎯 due_next'],['prompt','📝 Prompt'],['edit','✏️ Prompts'],[model==='unit'?'units':'skills',model==='unit'?'🪜 Units':'🌱 Skills'],['hist','📊 History'],['settings','⚙︎ LLM']].map(([k,lab])=>(
          <div key={k} className={'tab '+(tab===k?'on':'')} onClick={()=>setTab(k)}>{lab}</div>))}
      </div>
      <div className="panel">
        {tab==='readme'&&<ReadmeView/>}
        {tab==='memory'&&<MemoryView mem={mem} hl={hl} changes={changes} snapshots={snapshots}/>}
        {tab==='judge'&&<JudgeView scores={judgeOut}/>}
        {tab==='dual'&&<DualView dual={dualJudge}/>}
        {tab==='session'&&<SessionView sessions={sessions}/>}
        {tab==='due'&&<DueView model={model} mem={mem} level={level}/>}
        {tab==='prompt'&&<PromptView text={buildConvPrompt(msgs)}/>}
        {tab==='edit'&&<EditView prompts={prompts} setPrompts={setPrompts} model={model}/>}
        {tab==='skills'&&<SkillsView mem={mem} skills={byLevel(level)}/>}
        {tab==='units'&&<UnitsView mem={mem}/>}
        {tab==='hist'&&<HistView history={history}/>}
        {tab==='settings'&&<SettingsView/>}
      </div>
    </div>
  </div>);
}

function RM({t,children}){return <div style={{marginBottom:14}}><div className="lbl">{t}</div>{children}</div>;}
function ReadmeView(){
  const p={fontSize:13.5,lineHeight:1.6,color:'#3a352e',marginBottom:8};
  const code={fontFamily:'monospace',background:'#f0ece2',padding:'1px 5px',borderRadius:4,fontSize:12};
  const li={fontSize:13,lineHeight:1.55,marginBottom:5,color:'#3a352e'};
  return(<div style={{maxWidth:640}}>
    <div style={{fontFamily:'Georgia,serif',fontSize:21,fontWeight:700,color:'#1f1b16',marginBottom:4}}>ELLA Loop Simulator — read me first</div>
    <p style={p}>This is a <b>glass box</b>. The left side is what a learner sees (a chat with Zoe). The right side exposes everything normally hidden — the prompts, the scoring, the memory, the progression. The point is to <i>watch the learning loop work and decide if it's right</i>, not to be a polished app.</p>

    <RM t="The loop, in one breath">
      <p style={p}>A learner talks to Zoe → after the chat a <b>judge</b> scores which skills were shown → deterministic code updates the <b>memory object</b> → that decides what the next chat aims at. Round and round. <b>LLMs produce signals (Zoe talks, judge scores); plain code makes the decisions (what's owned, what's next).</b> An LLM never decides state.</p>
    </RM>

    <RM t="How to drive it (try this first)">
      <ol style={{margin:'0 0 0 18px'}}>
        <li style={li}>Pick a <b>mode</b> top-left: <b>micro-skill</b> (flat list of skills) or <b>units</b> (your colleague's 5-step journey). Try units.</li>
        <li style={li}>Hit <b>🤖 auto</b>, then <b>Next turn ▶</b> a few times — a simulated learner talks to Zoe so you don't have to type.</li>
        <li style={li}>Hit <b>End chat &amp; judge ⚖️</b> — watch the right side update.</li>
        <li style={li}>Hit <b>Next chat →</b> and repeat 5–10 times. Watch the <b>📊 History</b> and <b>🧠 Memory</b> tabs to see the arc.</li>
        <li style={li}>To use a real LLM (and let colleagues run it), see <b>⚙︎ LLM</b>.</li>
      </ol>
    </RM>

    <RM t="What each glass-box tab shows">
      <ul style={{margin:'0 0 0 16px'}}>
        <li style={li}><b>🧠 Memory</b> — the learner's whole state, live. Changed fields flash yellow after judging.</li>
        <li style={li}><b>⚖️ Judge</b> — the raw per-skill scores from the last chat (confidence + evidence quote).</li>
        <li style={li}><b>⚖️⚖️ Both</b> — the same transcript scored under <i>both</i> models, side by side.</li>
        <li style={li}><b>📄 Session</b> — the immutable record written each chat (accumulates; memory overwrites).</li>
        <li style={li}><b>🎯 due_next</b> — what the next chat is aimed at, and why.</li>
        <li style={li}><b>📝 Prompt</b> — the exact prompt Zoe is running on right now.</li>
        <li style={li}><b>✏️ Prompts</b> — edit any prompt live and re-run to see the effect.</li>
        <li style={li}><b>🪜 Units / 🌱 Skills</b> — the curriculum and what's owned.</li>
        <li style={li}><b>⚙︎ LLM</b> — switch which model powers Zoe and the judge.</li>
      </ul>
    </RM>

    <RM t="Every memory parameter, explained">
      <ul style={{margin:'0 0 0 16px'}}>
        <li style={li}><span style={code}>profile</span> — name, age, grade, home_language. For personalisation &amp; tone. (Sensitive if a minor — handle with care in production.)</li>
        <li style={li}><span style={code}>level</span> — current CEFR band (A1…C2).</li>
        <li style={li}><span style={code}>owned</span> — skills demonstrated enough to count as learned.</li>
        <li style={li}><span style={code}>emerging</span> — skills seen at least once but not yet owned ("started, not finished").</li>
        <li style={li}><span style={code}>due_next</span> — <b>{'{primary, watching[]}'}</b>. <i>primary</i> = the one skill Zoe actively steers toward; <i>watching</i> = a couple the judge also looks for if they come up.</li>
        <li style={li}><span style={code}>last_topics</span> — recent conversation topics. <b>Load-bearing:</b> the topic-picker avoids these so chats don't repeat.</li>
        <li style={li}><span style={code}>interests</span> — what the learner likes; feeds topic selection. Grows by listening to them over time.</li>
        <li style={li}><span style={code}>effort.times_spoken_total</span> — lifetime count of turns. The one number a learner sees. Only ever goes up; no streaks.</li>
        <li style={li}><span style={code}>sightings</span> — how many <i>qualifying</i> times each skill has been shown. Ownership needs ≥{`${''}`}2 (corroboration), so one lucky chat doesn't own a skill.</li>
        <li style={li}><span style={code}>strength</span> — unprompted demonstrations; future decay reads this.</li>
        <li style={li}><span style={code}>last_seen</span> — date each skill last appeared; future decay reads this.</li>
        <li style={li}><span style={code}>updated_after_chat</span> — which chat last changed this memory.</li>
      </ul>
    </RM>

    <RM t="How a skill becomes 'owned' (the rule that matters most)">
      <p style={p}>Three states: <b>locked → emerging → owned</b>. A skill enters <i>emerging</i> on first real evidence. It becomes <i>owned</i> when it's been shown well enough, <b>enough times</b>:</p>
      <ul style={{margin:'0 0 0 16px'}}>
        <li style={li}><b>The bar scales with level</b> — at A1 a skill is "owned" at confidence ≥0.55 (understood is enough); by B1 it needs ≥0.68 (accuracy matters). A beginner owns by being understood; an advanced learner owns by being correct.</li>
        <li style={li}><b>Needs ≥2 sightings</b> across chats — not one lucky moment.</li>
        <li style={li}><b>Effort path at A1/A2</b> — repeated honest attempts can own a skill even without a peak score, because the principle is <i>reward effort, not accuracy</i>.</li>
        <li style={li}><b>Never demotes</b> here (decay is deferred).</li>
      </ul>
    </RM>

    <RM t="Units mode: how you advance (communicate-to-advance)">
      <p style={p}>A unit (step) completes when its <b>fluency &amp; vocabulary</b> skills are owned AND its <b>grammar</b> skills are at least <i>emerging</i> (attempted, not locked). Grammar is allowed to keep maturing in later units. This stops a beginner being walled by one hard grammar skill, and keeps the gate aligned with "reward effort." Completing all steps = level-up.</p>
    </RM>

    <RM t="How topics work (why chats stay fresh)">
      <p style={p}>The <i>skill</i> being targeted may repeat for several chats (a skill takes ≥2 sightings to own). To stop chats feeling samey, the <b>topic</b> changes: a topic bank (from the framework — themes like family, sports, festivals) supplies a fresh topic each chat, chosen to match the learner's interests and avoid <span style={code}>last_topics</span>. Same skill, new context each time. <b>Note:</b> topics aren't yet tagged to specific skills — right now the pick is by level + interest + freshness, not "best topic for this exact skill." That tagging is an open authoring task.</p>
    </RM>

    <RM t="What to look at to judge if the loop works">
      <ul style={{margin:'0 0 0 16px'}}>
        <li style={li}><b>Does Zoe actually steer to the primary skill?</b> Compare 🎯 due_next's primary against what the chat covered. If she drifts, due_next is decorative.</li>
        <li style={li}><b>aimed vs hit</b> (History &amp; Session tabs) — of the skills we aimed at, how many actually showed up.</li>
        <li style={li}><b>Does the judge score sensibly?</b> Read the ⚖️ Judge evidence quotes — do the confidences match what the learner really did?</li>
        <li style={li}><b>Does memory evolve believably?</b> Watch owned climb and due_next shift across chats (Memory snapshots).</li>
        <li style={li}><b>Does it stall?</b> Run a weak learner (manual mode, give short broken answers) — do they get stuck, and does that feel fair?</li>
      </ul>
    </RM>

    <div className="note" style={{marginTop:6}}><span className="lab">Honest limits</span>This proves the <b>loop and the prompts</b>, not the production model or the voice layer. It uses typed text (no speech/STT), and the model is whatever ⚙︎ LLM is set to (Claude runtime by default, not Gemini). Treat the behaviour as directional, not final.</div>
  </div>);
}
function MemoryView({mem,hl,changes,snapshots}){
  return(<div>
    {changes.length>0&&<div><div className="lbl">state changes this chat</div>
      {changes.map((c,i)=><div className="chg" key={i}><b>{c.id}</b> — {skillText(c.id)}<br/>{c.from} → <b>{c.to}</b> {c.to==='owned'?'🌸':'🌱'}</div>)}</div>}
    <div className="lbl">memory object {mem.updated_after_chat>0?('· updated after chat '+mem.updated_after_chat):'· (fresh)'}</div>
    <div className="mono">
{'{'}
<div className="memfield">  <span className="k">"profile"</span>: {'{'} name:"{mem.name||'—'}", age:{mem.age||'null'}, grade:{mem.grade||'null'}, home_language:"{mem.home_language}" {'}'}</div>
<div className="memfield">  <span className="k">"level"</span>: "{mem.level}",</div>
<div className={'memfield '+(hl.owned?'hl':'')}>  <span className="k">"owned"</span> [{mem.owned.length}]: {JSON.stringify(mem.owned)}</div>
<div className={'memfield '+(hl.emerging?'hl':'')}>  <span className="k">"emerging"</span>: {JSON.stringify(mem.emerging)}</div>
<div className={'memfield '+(hl.due_next?'hl':'')}>  <span className="k">"due_next"</span>: {JSON.stringify(mem.due_next)}</div>
<div className="memfield">  <span className="k">"last_topics"</span>: {JSON.stringify(mem.last_topics||[])}</div>
<div className="memfield">  <span className="k">"interests"</span>: "{mem.interests}"</div>
<div className={'memfield '+(hl.effort?'hl':'')}>  <span className="k">"effort"</span>: {JSON.stringify(mem.effort)}</div>
<div className="memfield">  <span className="k">"sightings"</span>: {JSON.stringify(mem.sightings)}</div>
<div className="memfield">  <span className="k">"strength"</span>: {JSON.stringify(mem.strength)}</div>
<div className="memfield">  <span className="k">"updated_after_chat"</span>: {mem.updated_after_chat}</div>
{'}'}
    </div>
    {snapshots.length>0&&<div><div className="lbl">memory after each chat</div>
      {snapshots.map((s,i)=><div className="hist" key={i}><b>after chat {s.chat}</b> ({s.model}) · owned {s.owned.length} · emerging {s.emerging.length}<br/><span style={{fontFamily:'monospace',fontSize:'10px',color:'#5b50c4'}}>due → {s.due.join(', ')}</span></div>)}</div>}
    <small className="note">owned/emerging hold buckets; confidence is NOT stored here (see Session log). Snapshots show how memory evolved chat by chat.</small>
  </div>);
}
function JudgeView({scores}){
  if(!scores)return<div style={{color:'#8a8678'}}>No judge run yet. Have a short chat, then <b>End chat &amp; judge</b>.</div>;
  return(<div><div className="lbl">judge output — skills_evidenced[]</div>
    {scores.map((s,i)=>(<div className="ev" key={i}>
      <span className="conf" style={{color:s.confidence>=0.7?'#23682f':s.confidence>=0.3?'#c8861a':'#b8472f'}}>{Number(s.confidence).toFixed(2)}</span>
      <span className="id">{s.id}</span> {s.prompted?'· prompted':'· unprompted'}
      <span className="nm">{skillText(s.id)}</span>
      <div className="confbar"><i style={{width:(s.confidence*100)+'%'}}></i></div>
      {s.evidence&&<div style={{marginTop:5,fontStyle:'italic',color:'#4a443c'}}>"{s.evidence}"</div>}
    </div>))}
    <small className="note">≥0.70 promotes emerging→owned · ≥0.30 starts locked→emerging · &lt;0.30 ignored.</small>
  </div>);
}
function DualView({dual}){
  if(!dual)return<div style={{color:'#8a8678'}}>No comparison yet. End a chat — the same transcript is judged under BOTH models and shown side by side.</div>;
  const col=(c)=>c>=0.7?'#23682f':c>=0.3?'#c8861a':'#b8472f';
  const render=(blk)=>(<div style={{flex:1,minWidth:0}}>
    <div className="lbl">{blk.label} model</div>
    {blk.scores.map((s,i)=>(<div className="ev" key={i} style={{padding:'5px 7px'}}>
      <span className="conf" style={{color:col(s.confidence)}}>{Number(s.confidence).toFixed(2)}</span>
      <span className="id" style={{fontSize:'10px'}}>{s.id}</span>
      <span className="nm" style={{fontSize:'11px'}}>{skillText(s.id)}</span>
    </div>))}
  </div>);
  return(<div><div className="warn">Same transcript, judged two ways. The conversation was steered by the <b>{dual.primary.label}</b> model; this shows how each curriculum would score it.</div>
    <div style={{display:'flex',gap:10}}>{render(dual.primary)}{render(dual.other)}</div>
  </div>);
}
function SessionView({sessions}){
  const [open,setOpen]=React.useState(null);
  if(sessions.length===0)return<div style={{color:'#8a8678'}}>No session logs yet. Each completed chat writes one <b>immutable</b> record here.</div>;
  return(<div><div className="lbl">session logs — immutable, one per chat ({sessions.length})</div>
    {sessions.map((s,i)=>(<div key={i} style={{marginBottom:8}}>
      <div className="due" style={{cursor:'pointer',background:open===i?'#fff':'var(--blue-soft)'}} onClick={()=>setOpen(open===i?null:i)}>
        <div className="b">{s.session_id} · {s.level} · {s.progression_model} · {s.turns_total} turns</div>
        aimed {s.aimed_at.length}, hit <b>{s.hit_targets.length}</b> · {s.state_changes.length} changes {open===i?'▲':'▼'}
      </div>
      {open===i&&<div className="mono" style={{background:'#1f1b16',color:'#efe9d8',padding:12,borderRadius:8,marginTop:4}}>{JSON.stringify(s,null,1)}</div>}
    </div>))}
    <small className="note">Accumulate (memory overwrites; these don't). 'aimed/hit' shows whether due_next steering worked.</small>
  </div>);
}
function DueView({model,mem,level}){
  const picks = model==='unit'? dueUnit(mem).picks : dueSkill(mem,level);
  const u = model==='unit'? activeStep(mem):null;
  return(<div><div className="lbl">due_next — what Zoe is steered toward {model==='unit'?'(units mode)':'(micro-skill mode)'}</div>
    {model==='unit'&&u&&<div className="warn">Active unit: <b>{u.name}</b> — {u.focus}</div>}
    {picks.length===0&&<div style={{color:'#8a8678'}}>Nothing due (all complete at this level/unit).</div>}
    {picks.map((d,i)=>(<div className="due" key={i}><div className="b">#{i+1} · {d.why}</div><b>{d.id}</b><br/>{skillText(d.id)}</div>))}
    <small className="note">This exact list is injected into Zoe's prompt (see 📝 Prompt tab → it appears under the due_next/UNIT block). Recomputed after every chat.</small>
  </div>);
}
function PromptView({text}){
  return(<div><div className="lbl">assembled conversation prompt (live)</div>
    <div className="mono" style={{background:'#1f1b16',color:'#efe9d8',padding:12,borderRadius:8}}>{text}</div>
    <small className="note">Base + level profile + the due_next/unit steering block + transcript. The target skills here ARE due_next.</small>
  </div>);
}
function EditView({prompts,setPrompts,model}){
  const fields=[['base','Base prompt (shared)'],['profileA1','Profile · A1/A2'],['profileB1','Profile · B1+'],
    [model==='unit'?'convUnit':'convSkill', model==='unit'?'Conversation framing · UNITS (theme-led)':'Conversation framing · MICRO-SKILL (list-led)'],
    ['judge','Judge (shared)']];
  return(<div><div className="warn">Edit any prompt, run a chat, see the effect. Conversation framing differs by model; judge & base are shared. {'{{TARGETS}}'}, {'{{UNITNAME}}'}, {'{{UNITFOCUS}}'} are filled in automatically.</div>
    {fields.map(([k,lab])=>(<div key={k} style={{marginBottom:14}}><div className="lbl">{lab}</div>
      <textarea value={prompts[k]} onChange={e=>setPrompts(p=>({...p,[k]:e.target.value}))}/></div>))}
    <button className="ghost" onClick={()=>setPrompts(DEFAULT_PROMPTS)}>↺ Reset prompts</button>
  </div>);
}
function SkillsView({mem,skills}){
  const b=id=>mem.owned.includes(id)?'owned':mem.emerging.includes(id)?'emerging':'locked';
  const g={VOC:[],GRA:[],FLU:[]}; skills.forEach(s=>g[s.strand].push(s));
  return(<div>{Object.entries(g).map(([st,arr])=>(<div key={st}>
    <div className="lbl">{STRANDS[st]} — {arr.filter(s=>b(s.id)==='owned').length}/{arr.length} owned</div>
    {arr.map(s=>{const bk=b(s.id);return(<div className="skill" key={s.id}><span className={'dot d-'+bk}></span>
      <span style={{fontFamily:'monospace',fontSize:'10px',opacity:.6,minWidth:66}}>{s.id}</span>
      <span style={{opacity:bk==='locked'?.55:1}}>{s.text}</span></div>);})}
  </div>))}</div>);
}
function UnitsView({mem}){
  const active=activeStep(mem);
  return(<div><div className="lbl">units — the A1→A2 journey (your colleague's 5 steps)</div>
    {UNITS_A1.map(u=>{const p=stepProgress(mem,u); const done=p.owned===p.total; const isActive=active&&active.step===u.step;
      const cls=done?'done':isActive?'active':'locked';
      return(<div className={'unit '+cls} key={u.step}>
        <div className="uh"><span>Step {u.step}: {u.name}</span><span>{p.owned}/{p.total} {done?'✓':isActive?'◀ active':''}</span></div>
        <div className="ub"><div style={{fontSize:11,color:'#666',marginBottom:4}}>{u.focus}</div>
          <div className="ubar"><i style={{width:(p.owned/p.total*100)+'%'}}></i></div>
          {u.skills.map(s=>{const bk=mem.owned.includes(s.id)?'owned':mem.emerging.includes(s.id)?'emerging':'locked';
            return(<div className="skill" key={s.id}><span className={'dot d-'+bk}></span><span style={{opacity:bk==='locked'?.55:1,fontSize:12}}>{s.text}</span></div>);})}
        </div></div>);})}
    <small className="note">A level-up = all 5 steps complete. The active step drives due_next. This is the units answer to the "level-up rule" hole.</small>
  </div>);
}
function SettingsView(){
  const [,force]=React.useState(0); const rerender=()=>force(x=>x+1);
  const C=LLM_CONFIG;
  const setMode=m=>{C.mode=m;rerender();};
  const setRole=(role,field,val)=>{C[role][field]=val;rerender();};
  const [test,setTest]=React.useState('');
  async function testCall(){
    setTest('testing…');
    const r=await callLLM('Reply with exactly: OK','conv');
    setTest(r.ok?('✓ conv model replied: "'+String(r.text).slice(0,40)+'"'):('✗ '+r.err));
  }
  const providers=['openrouter','deepseek','openai','custom'];
  const roleBlock=(role,label)=>(
    <div style={{border:'1.5px solid var(--rule)',borderRadius:8,padding:10,marginBottom:10}}>
      <div className="lbl" style={{marginTop:0}}>{label} model</div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
        <select value={C[role].provider} onChange={e=>setRole(role,'provider',e.target.value)}>
          {providers.map(p=><option key={p}>{p}</option>)}
        </select>
        <input style={{flex:1,minWidth:120,padding:'5px 8px',border:'1.5px solid var(--ink)',borderRadius:6,fontSize:12}}
          placeholder={C[role].provider==='custom'?'https://url||model-name':'model name (e.g. deepseek-chat)'}
          value={C[role].model} onChange={e=>setRole(role,'model',e.target.value)}/>
      </div>
      {C.mode==='direct' && <input style={{width:'100%',padding:'5px 8px',border:'1.5px solid var(--ink)',borderRadius:6,fontSize:12}}
        type="password" placeholder="API key (stays in this page only)" value={C[role].key} onChange={e=>setRole(role,'key',e.target.value)}/>}
    </div>);
  return(<div>
    <div className="warn">Switch which LLM powers Zoe and the Judge. Three modes — see notes. Keys you paste live only in this page (never stored/sent anywhere but the provider).</div>
    <div className="lbl">mode</div>
    <div className="modeToggle" style={{marginBottom:10,display:'inline-flex'}}>
      {[['runtime','Claude.ai runtime'],['direct','Direct (browser→provider)'],['proxy','Proxy (your backend)']].map(([m,l])=>(
        <button key={m} className={C.mode===m?'on':''} onClick={()=>setMode(m)}>{l}</button>))}
    </div>
    {C.mode==='runtime'&&<div className="ev">Uses the built-in Claude channel. Works <b>only inside Claude.ai</b>. No key needed. Won't work if you send the file to a colleague.</div>}
    {C.mode==='direct'&&<div className="ev">Browser calls the provider directly with your key. <b>Works for CORS-friendly providers (OpenRouter reliably; DeepSeek sometimes).</b> Most providers BLOCK this — if you get a CORS error, use Proxy mode.</div>}
    {C.mode==='proxy'&&<div className="ev">Calls your backend, which holds the key and forwards to any provider. <b>Works for everything incl. Gemini. Lets colleagues use it.</b> Needs the proxy running (see the proxy file).
      <input style={{width:'100%',marginTop:6,padding:'5px 8px',border:'1.5px solid var(--ink)',borderRadius:6,fontSize:12}}
        placeholder="proxy URL e.g. http://localhost:8000/complete" value={C.proxyUrl} onChange={e=>{C.proxyUrl=e.target.value;rerender();}}/></div>}
    {C.mode!=='runtime' && <div>{roleBlock('conv','🗣️ Conversation (Zoe)')}{roleBlock('judge','⚖️ Judge — use a DIFFERENT model than Zoe')}</div>}
    <button className="ghost" onClick={testCall}>Test conv model</button> <span style={{fontSize:12,marginLeft:8}}>{test}</span>
    <small className="note">Your stated eval principle: the judge should be a different model than the one being tested. This panel lets you set them separately.</small>
  </div>);
}
function HistView({history}){
  if(history.length===0)return<div style={{color:'#8a8678'}}>No chats completed yet.</div>;
  return(<div><div className="lbl">session history — the loop evolving</div>
    {history.map((h,i)=>(<div className="hist" key={i}><b>chat {h.chat}</b> ({h.model}/{h.level}) · owned {h.owned} · +{h.changes} grew · aimed {h.aimed}/hit <b>{h.hit}</b> · {h.turns} turns</div>))}
    <small className="note">'aimed/hit' = did due_next steering work — how many targets actually showed up.</small>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
