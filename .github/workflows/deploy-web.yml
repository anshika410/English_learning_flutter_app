name: Deploy Web to GitHub Pages

# Triggered on any branch push touching frontend or HTML files

on:
  push:
    branches:
      - '**'
    paths:
      - 'frontend/**'
      - 'ella-*.html'

  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create .env
        working-directory: frontend
        run: |
          cat > .env << 'EOF'
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL=https://api.deepseek.com/v1
          DEEPSEEK_MODEL=deepseek-chat
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL=https://api.openai.com/v1
          OPENAI_MODEL=gpt-4o-mini
          DEFAULT_LLM=deepseek
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          EOF

      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      - name: Build web
        working-directory: frontend
        run: flutter build web --base-href /ella_flutter/ella-v1/

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/ella-v1
          cp -r frontend/build/web/. deploy/ella-v1/
          cp ella-v0.html deploy/ella-v0.html
          cp ella-design-v1.html deploy/ella-design-v1.html
          cp ella-admin.html deploy/ella-admin.html
          # Root redirect → ella-v1
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Ella — Redirecting...</title>
              <meta http-equiv="refresh" content="0; url=ella-v1/">
            </head>
            <body>Redirecting to <a href="ella-v1/">Ella app</a>...</body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          publish_branch: gh-pages
          keep_files: true
