function GoogleSignIn() {
  const [user, setUser] = React.useState(window.__ellaUser);
  React.useEffect(() => {
    const check = setInterval(() => {
      if (window.__ellaUser !== user) setUser(window.__ellaUser);
    }, 500);
    return () => clearInterval(check);
  }, [user]);

  React.useEffect(() => {
    if (user) return;
    let attempts = 0;
    const interval = setInterval(() => {
      attempts++;
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.renderButton(
          document.getElementById("gsi-signin-btn-header"),
          { theme: "outline", size: "medium", shape: "pill" }
        );
        clearInterval(interval);
      } else if (attempts > 30) {
        clearInterval(interval);
      }
    }, 200);
    return () => clearInterval(interval);
  }, [user]);

  if (user) {
    return (
      <div style={{display:'inline-flex', alignItems:'center', gap:6, padding:'4px 10px', background:'#f5f3ee', borderRadius:16, fontSize:12, marginRight:8}}>
        <img src={user.picture} referrerPolicy='no-referrer' style={{width:22, height:22, borderRadius:'50%', border:'1px solid #ccc'}} />
        <span style={{fontWeight:600}}>{user.name}</span>
        <span onClick={()=>{window.__ellaSignOut(); setUser(null); window.location.reload();}} style={{cursor:'pointer', color:'#888', fontSize:11, marginLeft:4}}>(sign out)</span>
      </div>
    );
  }
  return (
    <div id="gsi-signin-btn-header" style={{display:'inline-block', marginRight:8, verticalAlign:'middle'}}></div>
  );
}

function VersionBadge() {
  const [ver, setVer] = React.useState(null);
  const [restored, setRestored] = React.useState(window.__restoredFrom);
  const fetchVer = () => {
    fetch(LLM_CONFIG.ellaApiUrl + '/admin/prompts/versions?key=ella-admin-2026-xK9m')
      .then(r => r.json())
      .then(data => { if (data.length) setVer(data[0]); })
      .catch(() => {});
  };
  React.useEffect(() => {
    fetchVer();
    const interval = setInterval(fetchVer, 10000);
    const updateState = () => {
      fetchVer();
      setRestored(window.__restoredFrom);
    };
    window.addEventListener('prompt-deployed', updateState);
    window.addEventListener('prompt-restored', updateState);
    return () => {
      clearInterval(interval);
      window.removeEventListener('prompt-deployed', updateState);
      window.removeEventListener('prompt-restored', updateState);
    };
  }, []);
  if (!ver) return null;
  const date = new Date(ver.created_at).toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true});
  
  if (restored) {
    return (
      <div style={{fontSize:11, padding:'4px 10px', background:'#ffebee', border:'1.5px solid #ef5350', color:'#c62828', borderRadius:6, marginBottom:10, display:'inline-block'}}>
        ⚠️ Restored Draft: <b>{restored}</b> (unsaved editor draft) &middot; <span style={{fontWeight:600}}>Deploy to push this live!</span>
      </div>
    );
  }

  let noteText = ver.notes;
  if (noteText && noteText.toLowerCase().includes('rolled back')) {
    noteText = 'Rolled Back';
  }

  return (
    <div style={{fontSize:11, color:'#555', padding:'4px 10px', background:'#f5f3ee', borderRadius:6, marginBottom:10, display:'inline-block'}}>
      Current version: <b>{ver.version}</b> {noteText ? <span style={{color:'var(--rust)', fontWeight:600}}>({noteText}) </span> : null}by {ver.author} &middot; {date}
    </div>
  );

  }

  const getSightingsCount = (skillId) => {
    return isApi ? (apiSightings[skillId] || 0) : (mem.sightings ? mem.sightings[skillId] || 0 : 0);
  };

  const getSkillStatus = (skillId) => {
    if (isApi) {
      return apiStatus[skillId] || 'locked';
    } else {
      const owned = mem.owned || [];
      const emerging = mem.emerging || [];
      if (owned.includes(skillId)) return 'owned';
      if (emerging.includes(skillId)) return 'emerging';
      return 'locked';
    }
  };

  const renderPlant = (skill, positionClass, unitName = '') => {
    const count = getSightingsCount(skill.id);
    const evidenceList = isApi ? (apiEvidence[skill.id] || []) : [];
    const plainEvidence = evidenceList.map(ev => typeof ev === 'object' ? `${ev.evidence} (conf: ${ev.confidence}${ev.prompted ? ', prompted' : ''})` : ev);
    const evidenceStr = plainEvidence.length > 0 ? "\nEvidence:\n• " + plainEvidence.join("\n• ") : "";
    
    const status = getSkillStatus(skill.id);

    const colors = {
      VOC: { bud: '#ff8da1', bloomBg: '#ffccd5', center: '#d90429' },
      GRA: { bud: '#ffc107', bloomBg: '#fff3cd', center: '#b89500' },
      FLU: { bud: '#9b5de5', bloomBg: '#e8dbfc', center: '#5a189a' }
    };
    
    const theme = colors[skill.strand] || colors.VOC;

    const lastTestedAt = isApi ? (skill.last_tested_at || null) : (mem.last_seen[skill.id] || null);

    const handleSelect = () => {
      setSelectedSkill({
        id: skill.id,
        text: skill.text,
        strand: skill.strand,
        sightings: count,
        last_tested_at: lastTestedAt,
        evidence: evidenceList,
        unitName: unitName
      });
    };

    const getPlantImgOnly = () => {
      const strand = skill.id.split('-')[1] || 'GRA';
      let effectiveCount = count;
      if (status === 'owned' && effectiveCount < 2) {
        effectiveCount = 3;
      }

      if (effectiveCount === 1) {
        return '/docs/logo/fluency-sprout.png';
      }
      if (effectiveCount === 2) {
        if (strand === 'FLU') return '/docs/logo/fluency-mid-grown.png';
        if (strand === 'VOC') return '/docs/logo/vocabulary-mid.png';
        return '/docs/logo/grammar-mid.png';
      }
      if (effectiveCount >= 3) {
        if (strand === 'FLU') return '/docs/logo/fluency-fully-bloom.png';
        if (strand === 'VOC') return '/docs/logo/vocabulary-fully-bloom.png';
        return '/docs/logo/grammar-fully-bloom.png';
      }
      return null;
    };

    const plantImg = getPlantImgOnly();

    // Calculate dynamic overlay dimensions to show growth progress
    let overlayWidth = '40%';
    let overlayHeight = '80%';
    let overlayLeft = '30%';

    let effectiveCountForSize = count;
    if (status === 'owned' && effectiveCountForSize < 2) {
      effectiveCountForSize = 3;
    }

    if (effectiveCountForSize === 1) {
      overlayWidth = '30%';
      overlayHeight = '60%';
      overlayLeft = '35%';
    } else if (effectiveCountForSize === 2) {
      overlayWidth = '35%';
      overlayHeight = '70%';
      overlayLeft = '32.5%';
    }

    return (
      <div 
        className={`iso-grid-slot ${positionClass}`} 
        key={skill.id} 
        title={`${skill.id} - ${status.toUpperCase()} (${count} sightings)${evidenceStr}`} 
        onClick={handleSelect} 
      >
        {/* Base underlay block: grass or dry soil */}
        <img 
          src={effectiveCountForSize === 0 ? '/docs/logo/empty-tile.png' : '/docs/logo/tile-turf-grass.png'} 
          alt="Tile Base" 
          style={{ 
            width: '100%', 
            height: '100%', 
            objectFit: 'contain', 
            pointerEvents: 'none',
            position: 'absolute',
            top: 0,
            left: 0,
            zIndex: 1
          }} 
        />
        
        {/* Plant growth overlay */}
        {plantImg && (
          <img 
            className="plant-overlay"
            src={plantImg} 
            alt={skill.id} 
            style={{ 
              width: overlayWidth, 
              height: overlayHeight, 
              objectFit: 'contain', 
              pointerEvents: 'none',
              position: 'absolute',
              bottom: '46%', 
              left: overlayLeft, 
              zIndex: 2
            }} 
          />
        )}
      </div>
    );
  };

  return (
    <div className="garden-map-container" style={{ position: 'relative' }}>
      <div className="garden-header">
        <h3>🏡 {level} Garden Map</h3>
      </div>
      
      <div className="garden-viewport">
        {/* Alternate Nodes along the path */}
        {steps.map((u, i) => {
          const sideClass = i % 2 === 0 ? 'step-left' : 'step-right';
          const isStepFullyBloomed = u.skills.every(s => bucketOf(mem, s.id) === 'owned');

          return (
            <div className={`garden-step-node ${sideClass}`} style={{top: `${i * 300 + 40}px`}} key={u.step}>
              <div className="step-label">
                <div className="step-title">{u.name}</div>
              </div>

              <div className="raised-bed-tile" style={{ position: 'relative' }}>
                <div className="tile-surface" style={{ width: '100%', height: '100%', position: 'relative', background: 'transparent', border: 'none', boxShadow: 'none', transform: 'none' }}>
                  {/* Grass plot base circle image */}
                  <img 
                    className="grass-base-ellipse" 
                    src="/docs/logo/ground-elipse.png" 
                    alt="Grass Base" 
                    style={{
                      position: 'absolute',
                      width: '250px',
                      height: '120px',
                      top: '52px',
                      left: '-5px',
                      zIndex: 0,
                      objectFit: 'contain'
                    }} 
                  />

                  <div className="grid-2x2-iso" style={{ position: 'relative', top: '-12px', zIndex: 1 }}>
                    {u.skills.length === 3 ? (
                      <>
                        {renderPlant(u.skills[0], 'iso-slot-left', u.name)}
                        {renderPlant(u.skills[1], 'iso-slot-back', u.name)}
                        {renderPlant(u.skills[2], 'iso-slot-right', u.name)}
                      </>
                    ) : (
                      <>
                        {u.skills[0] ? renderPlant(u.skills[0], 'iso-slot-left', u.name) : null}
                        {u.skills[1] ? renderPlant(u.skills[1], 'iso-slot-front', u.name) : null}
                        {u.skills[2] ? renderPlant(u.skills[2], 'iso-slot-back', u.name) : null}
                        {u.skills[3] ? renderPlant(u.skills[3], 'iso-slot-right', u.name) : null}
                      </>
                    )}
                  </div>

                  {/* Bush appears at the bottom-center of the grass plot only if the step has 3 skills */}
                  {u.skills.length === 3 && (
                    <img 
                      src="/docs/logo/bush.png" 
                      alt="bush" 
                      style={{ 
                        position: 'absolute', 
                        top: '122px', 
                        left: '50%', 
                        transform: 'translateX(-50%)', 
                        width: '42px', 
                        height: '31px', 
                        objectFit: 'contain',
                        zIndex: 5
                      }} 
                    />
                  )}

                  {/* Mastered/Bloomed step decorations */}
                  {isStepFullyBloomed && (
                    <>
                      {/* Butterfly hovering top-left */}
                      <img 
                        className="butterfly-fly"
                        src="/docs/logo/butterfly.png" 
                        alt="butterfly" 
                        style={{
                          position: 'absolute',
                          left: '16px',
                          top: '25px',
                          width: '32px',
                          height: '32px',
                          objectFit: 'contain',
                          zIndex: 10,
                          pointerEvents: 'none'
                        }}
                      />
                      {/* Stepping stones bottom-left */}
                      <img 
                        src="/docs/logo/stepping-stones1.png" 
                        alt="stepping stones" 
                        style={{
                          position: 'absolute',
                          left: '20px',
                          top: '125px',
                          width: '42px',
                          height: '24px',
                          objectFit: 'contain',
                          zIndex: 2,
                          pointerEvents: 'none'
                        }}
                      />
                    </>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {selectedSkill && (
        <div className="modal-overlay" style={{
          position: 'absolute',
          top: 0,
          left: 0,
          right: 0,
          bottom: 0,
          background: 'rgba(0,0,0,0.5)',

          justifyContent: 'center',
          alignItems: 'center',

            borderRadius: '6px',

            {(() => {

            {/* Extra Info: Sightings & Testing */}

                />
                <div style={{ fontSize: '14px', fontWeight: 'bold', color: '#5d4037', marginBottom: '4px' }}>

                </div>

                </div>

                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>

                    const timeAgoText = dateStr ? timeAgo(dateStr) : 'some time ago';
                    
                    return (
                      <div key={idx} style={{
                        background: '#fffde7',
                        border: '1.5px solid var(--ink)',
                        borderRadius: '6px',
                        padding: '10px 12px',
                        boxShadow: '1.5px 1.5px 0 var(--ink)'
                      }}>
                        <div style={{ fontSize: '12px', fontWeight: 'bold', color: '#5d4037', marginBottom: '4px' }}>
                          &ldquo;{quote}&rdquo;
                        </div>
                        <div style={{ fontSize: '10px', color: '#7f8c8d' }}>
                          {topic} &bull; {timeAgoText}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <button 
              className="act" 
              style={{ width: '100%', padding: '6px', fontSize: '12px' }}
              onClick={() => setSelectedSkill(null)}
            >
              Close
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function HistView({history}){

  return(<div><div className="lbl">session history — the loop evolving</div>
    {history.map((h,i)=>(<div className="hist" key={i}><b>chat {h.chat}</b> ({h.model}/{h.level}) · owned {h.owned} · +{h.changes} grew · aimed {h.aimed}/hit <b>{h.hit}</b> · {h.turns} turns</div>))}
    <small className="note">'aimed/hit' = did due_next steering work — how many targets actually showed up.</small>
  </div>);
}
function JsonViewer({ value, depth = 0 }) {
  const [isExpanded, setIsExpanded] = React.useState(depth < 1);

  if (value === null) {
    return <span style={{ color: '#ff7b72' }}>null</span>;
  }
  if (typeof value === 'boolean') {
    return <span style={{ color: '#ff7b72' }}>{value.toString()}</span>;
  }
  if (typeof value === 'number') {
    return <span style={{ color: '#ffab70' }}>{value}</span>;
  }
  if (typeof value === 'string') {
    return <span style={{ color: '#85e89d' }}>"{value}"</span>;
  }

  const isArray = Array.isArray(value);
  const keys = isArray ? value : Object.keys(value);
  const hasItems = isArray ? value.length > 0 : keys.length > 0;

  if (!hasItems) {
    return <span style={{ color: '#e1e4e8' }}>{isArray ? '[]' : '{}'}</span>;
  }

  return (
    <span style={{ fontFamily: 'monospace', fontSize: '11px', lineHeight: '1.4' }}>
      <span
        onClick={() => setIsExpanded(!isExpanded)}
        style={{
          cursor: 'pointer',
          userSelect: 'none',
          marginRight: 4,
          color: '#6a737d',
          fontSize: '9px',
          display: 'inline-block',
          transform: isExpanded ? 'rotate(0deg)' : 'rotate(-90deg)',
          transition: 'transform 0.1s ease',
          verticalAlign: 'middle'
        }}
      >
        ▼
      </span>
      <span style={{ color: '#e1e4e8' }}>{isArray ? '[' : '{'}</span>
      
      {isExpanded ? (
        <div style={{ paddingLeft: 16, borderLeft: '1px dashed rgba(255,255,255,0.1)' }}>
          {isArray ? (
            value.map((item, idx) => (
              <div key={idx} style={{ textIndent: 0 }}>
                <JsonViewer value={item} depth={depth + 1} />
                {idx < value.length - 1 && <span style={{ color: '#e1e4e8' }}>,</span>}
              </div>
            ))
          ) : (
            Object.entries(value).map(([key, val], idx, arr) => (
              <div key={key} style={{ textIndent: 0 }}>
                <span style={{ color: '#79b8ff' }}>"{key}"</span>: <JsonViewer value={val} depth={depth + 1} />
                {idx < arr.length - 1 && <span style={{ color: '#e1e4e8' }}>,</span>}
              </div>
            ))
          )}
        </div>
      ) : (
        <span
          onClick={() => setIsExpanded(true)}
          style={{
            background: 'rgba(255,255,255,0.08)',
            padding: '1px 5px',
            borderRadius: 3,
            cursor: 'pointer',
            fontSize: '10px',
            color: '#6a737d',
            margin: '0 4px',
            userSelect: 'none'
          }}
        >
          {isArray ? `${value.length} items` : `...`}
        </span>
      )}
      <span style={{ color: '#e1e4e8' }}>{isArray ? ']' : '}'}</span>
    </span>
  );
}
function getEndpointMeta(path, method) {
  if (path.startsWith('/auth/anonymous')) {
    return {
      desc: 'Authenticates a user anonymously using a unique device identifier.',
      schema: { device_id: 'string (Required)' }
    };
  }
  if (path.startsWith('/users/me/memory')) {
    return {
      desc: 'Retrieves the user\'s vocabulary, grammar, and fluency checklists.',
      schema: null
    };
  }
  if (path.startsWith('/users/me/garden')) {
    return {
      desc: 'Retrieves the user\'s CEFR garden step layout, active step index, and visual theme details.',
      schema: null
    };
  }
  if (path === '/session' && method === 'POST') {
    return {
      desc: 'Creates and initiates a new tutoring conversation session.',
      schema: { unit: 'string | null (Optional)', topic: 'string | null (Optional)' }
    };
  }
  if (path.startsWith('/session/') && path.endsWith('/turn')) {
    return {
      desc: 'Submits the user\'s chat turn message and receives Zoe\'s response.',
      schema: { content: 'string (Required)' }
    };
  }
  if (path.startsWith('/session/') && path.endsWith('/session-log')) {
    return {
      desc: 'Retrieves the compiled session log analysis, including evidenced skills, hit targets, and state changes.',
      schema: null
    };
  }
  if (path.startsWith('/llm/judge')) {
    return {
      desc: 'Runs the LLM Judge grading engine on a finished conversation transcript.',
      schema: {
        session_id: 'string (Required)',
        messages: 'array of message objects (Required)',
        unit: 'string (Required)',
        progression_model: 'string ("unit" | "micro-skill") (Required)',
        level: 'string (Required)',
        unit_label: 'string (Required)'
      }
    };
  }
  return null;
}

    setLoading(true);
    try{
      const data = await callEllaAPI('/users/me/today-recap');
      setTodayRecap(data || null);
    }catch(e){ console.error(e); }

  if(!recap) return(<div>
    <div style={{color:'#8a8678',marginBottom:12}}>No today recap data yet. Complete a conversation to see it here.</div>
    <button className="ghost" onClick={refresh} disabled={loading}>{loading?'Loading...':'🔄 Fetch Today Recap'}</button>
  </div>);

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>

    </div>
    <div style={{background:'#eaf7ed',border:'1.5px solid #3aa655',borderRadius:10,padding:12,marginBottom:12}}>

      <div style={{fontWeight:700,color:'#3aa655',fontSize:12,marginBottom:4}}>🌱 MAKE IT GROW</div>

      {recap.correction_highlight.corrected&&<div style={{fontSize:13,marginTop:4}}>Zoe says: "{recap.correction_highlight.corrected}"</div>}
    </div>}

    <div style={{marginTop:12,borderTop:'1px solid #d8cfbe',paddingTop:8}}>
      <div className="lbl">RAW API RESPONSE (GET /users/me/today-recap)</div>
      <pre className="mono" style={{background:'#24292e',color:'#e1e4e8',padding:10,borderRadius:8,fontSize:11,overflowX:'auto'}}>{JSON.stringify(recap,null,2)}</pre>

}
function ApiCallsView({logs, onClear}){
  const [openId, setOpenId] = React.useState(null);
  const [copied, setCopied] = React.useState(false);
  const [copiedId, setCopiedId] = React.useState(null);

  function copySingleLog(log, event) {
    if (event) event.stopPropagation();
    const divider = '─'.repeat(60);
    let out = `${divider}\n`;
    out += `${log.method} ${LLM_CONFIG.ellaApiUrl}${log.path}\n`;
    out += `Time: ${log.timestamp}  |  Status: ${log.status}\n`;
    out += `${divider}\n`;
    if (log.method !== 'GET') {
      out += `▸ Request Body:\n`;
      out += log.requestBody ? JSON.stringify(log.requestBody, null, 2) : '(empty)';
      out += `\n\n`;
    }
    out += `▸ Response Body:\n`;
    out += log.responseBody ? (typeof log.responseBody === 'string' ? log.responseBody : JSON.stringify(log.responseBody, null, 2)) : '(empty)';
    out += '\n';

    navigator.clipboard.writeText(out).then(() => {
      setCopiedId(log.id);
      setTimeout(() => setCopiedId(null), 2000);
    });
  }

  function copyAllLogs() {
    const lines = logs.map((log, i) => {
      const divider = '─'.repeat(60);
      let out = `${divider}\n`;
      out += `#${i+1}  ${log.method} ${LLM_CONFIG.ellaApiUrl}${log.path}\n`;
      out += `Time: ${log.timestamp}  |  Status: ${log.status}\n`;
      out += `${divider}\n`;
      if (log.method !== 'GET') {
        out += `▸ Request Body:\n`;
        out += log.requestBody ? JSON.stringify(log.requestBody, null, 2) : '(empty)';
        out += `\n\n`;
      }
      out += `▸ Response Body:\n`;
      out += log.responseBody ? (typeof log.responseBody === 'string' ? log.responseBody : JSON.stringify(log.responseBody, null, 2)) : '(empty)';
      out += '\n';
      return out;
    }).join('\n');

    const header = `ELLA API Traffic — ${logs.length} calls — copied at ${new Date().toLocaleString()}\n\n`;
    navigator.clipboard.writeText(header + lines).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }

  if (logs.length === 0) {
    return (
      <div style={{color:'#8a8678', textAlign:'center', marginTop:20}}>
        No API calls recorded yet. Try starting a chat or sending a message!
      </div>
    );
  }

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>
        <div className="lbl" style={{marginTop:0}}>API Traffic Logs ({logs.length})</div>
        <div style={{display:'flex', gap:6}}>
          <button className="act" style={{padding:'4px 10px', fontSize:11, background: copied ? '#2f7d46' : 'var(--green)'}} onClick={copyAllLogs}>
            {copied ? '✓ Copied!' : '📋 Copy All'}
          </button>
          <button className="ghost" style={{padding:'3px 8px', fontSize:11}} onClick={onClear}>Clear Logs</button>
        </div>
      </div>

      {logs.map((log) => {
        const isOpen = openId === log.id;
        const isSuccess = log.status && log.status.startsWith('2');
        const isPending = log.status === 'pending...';
        const badgeColor = isPending ? 'var(--amber)' : isSuccess ? 'var(--green)' : 'var(--rust)';
        const bgBadge = isPending ? 'var(--amber-soft)' : isSuccess ? 'var(--green-soft)' : '#fdebeb';

        return (
          <div key={log.id} style={{
            border: '1.5px solid var(--ink)',
            borderRadius: 8,
            marginBottom: 8,
            overflow: 'hidden',
            boxShadow: '1.5px 1.5px 0 var(--ink)',
            background: '#fff'
          }}>
            <div 
              onClick={() => setOpenId(isOpen ? null : log.id)} 
              style={{
                padding: '8px 10px',
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                background: '#f8f9fa',
                cursor: 'pointer',
                borderBottom: isOpen ? '1.5px solid var(--ink)' : 'none'
              }}
            >
              <div style={{display:'flex', gap:6, alignItems:'center'}}>
                <span style={{
                  background: log.method === 'POST' ? 'var(--blue-soft)' : log.method === 'PUT' ? 'var(--amber-soft)' : '#eee',
                  color: log.method === 'POST' ? 'var(--blue)' : log.method === 'PUT' ? 'var(--amber)' : 'var(--grey)',
                  padding: '2px 6px',
                  borderRadius: 4,
                  fontSize: 10,
                  fontWeight: 'bold'
                }}>{log.method}</span>
                <span style={{fontFamily:'monospace', fontSize:12, fontWeight:'600'}}>{log.path}</span>
              </div>
              <div style={{display:'flex', gap:6, alignItems:'center'}}>
                <span style={{fontSize:10, color:'var(--grey)'}}>{log.timestamp}</span>
                <span style={{
                  color: badgeColor,
                  background: bgBadge,
                  padding: '2px 6px',
                  borderRadius: 4,
                  fontSize: 10,
                  fontWeight: 'bold'
                }}>{log.status}</span>
                <button 
                  style={{
                    padding: '2px 6px', 
                    fontSize: 10, 
                    border: '1px solid var(--grey)', 
                    borderRadius: 4,
                    background: copiedId === log.id ? '#e8f5e9' : 'transparent',
                    color: copiedId === log.id ? '#2e7d32' : 'var(--grey)',
                    borderColor: copiedId === log.id ? '#2e7d32' : 'var(--grey)',
                    cursor: 'pointer'
                  }}
                  onClick={(e) => copySingleLog(log, e)}
                >
                  {copiedId === log.id ? '✓ Copied' : '📋 Copy'}
                </button>
              </div>
            </div>
            {isOpen && (
              <div style={{padding: 10, background: '#fafbfc', borderTop: '1px solid #e1e4e8'}}>
                <div style={{marginBottom: 8}}>
                  <div style={{fontSize: 10, fontWeight: 'bold', color: 'var(--blue)', textTransform: 'uppercase', marginBottom: 2}}>Full Request URL</div>
                  <div style={{
                    fontFamily: 'monospace',
                    background: '#f1f2f4',
                    border: '1px solid var(--rule)',
                    color: 'var(--ink)',
                    padding: '6px 8px',
                    borderRadius: 5,
                    fontSize: 11,
                    wordBreak: 'break-all'
                  }}>{LLM_CONFIG.ellaApiUrl}{log.path}</div>
                </div>
                {(() => {
                  const meta = getEndpointMeta(log.path, log.method);
                  const showRequestBody = log.method !== 'GET';
                  return (
                    <>
                      {meta && (
                        <div style={{marginBottom: 6, fontSize: 11, color: 'var(--grey)', fontStyle: 'italic'}}>
                          {meta.desc}
                        </div>
                      )}
                      {showRequestBody && (
                        <div style={{marginBottom: 8}}>
                          <div style={{fontSize: 10, fontWeight: 'bold', color: 'var(--rust)', textTransform: 'uppercase', marginBottom: 2}}>Request Body</div>
                          <pre style={{
                            background: '#24292e',
                            color: '#e1e4e8',
                            padding: 8,
                            borderRadius: 5,
                            fontSize: 11,
                            overflowX: 'auto',
                            whiteSpace: 'pre-wrap',
                            wordBreak: 'break-all',
                            marginBottom: 4
                          }}>{log.requestBody ? <JsonViewer value={log.requestBody} /> : '(empty)'}</pre>
                          {meta && meta.schema && (
                            <div style={{marginTop: 6, background: 'var(--paper2)', border: '1px dashed var(--rule)', padding: '6px 8px', borderRadius: 4}}>
                              <div style={{fontSize: 10, fontWeight: 'bold', color: 'var(--ink)', marginBottom: 2}}>Accepted/Required Fields:</div>
                              <pre style={{fontSize: 10, margin: 0, fontFamily: 'monospace', color: 'var(--ink)', whiteSpace: 'pre-wrap'}}>
                                {JSON.stringify(meta.schema, null, 2)}
                              </pre>
                            </div>
                          )}
                        </div>
                      )}
                    </>
                  );
                })()}
                <div>
                  <div style={{fontSize: 10, fontWeight: 'bold', color: 'var(--purple)', textTransform: 'uppercase', marginBottom: 2}}>Response Body</div>
                  <pre style={{
                    background: '#24292e',
                    color: '#e1e4e8',
                    padding: 8,
                    borderRadius: 5,
                    fontSize: 11,
                    overflowX: 'auto',
                    whiteSpace: 'pre-wrap',
                    wordBreak: 'break-all'
                  }}>{log.responseBody ? <JsonViewer value={log.responseBody} /> : '(empty)'}</pre>
                </div>
                {log.responseBody && log.responseBody.prompt_debug && (
                  <div style={{marginTop: 10}}>
                    <div style={{fontSize: 10, fontWeight: 'bold', color: '#FF9500', textTransform: 'uppercase', marginBottom: 6}}>
                      📝 Assembled System Prompt (what was sent to DeepSeek)
                    </div>
                    <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:8}}>
                      <span style={{background:'#e8f5e9',color:'#2e7d32',padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:700}}>Level: {log.responseBody.prompt_debug.level}</span>
                      <span style={{background:'#e3f2fd',color:'#1565c0',padding:'2px 8px',borderRadius:4,fontSize:11}}>Unit: {log.responseBody.prompt_debug.unit_name}</span>
                      <span style={{background:'#fff3e0',color:'#e65100',padding:'2px 8px',borderRadius:4,fontSize:11}}>Turn: {log.responseBody.prompt_debug.current_turn}</span>
                      <span style={{background:'#f3e5f5',color:'#6a1b9a',padding:'2px 8px',borderRadius:4,fontSize:11}}>Targets: {(log.responseBody.prompt_debug.target_ids||[]).join(', ') || 'none'}</span>
                    </div>

                    <pre style={{
                      background: '#1a1a2e',
                      color: '#a8d8a8',
                      padding: 10,
                      borderRadius: 6,
                      fontSize: 11,
                      overflowX: 'auto',
                      whiteSpace: 'pre-wrap',
                      wordBreak: 'break-word',
                      maxHeight: 400,
                      overflowY: 'auto',
                      border: '1px solid #FF9500'
                    }}>{log.responseBody.prompt_debug.system_prompt}</pre>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}
// Google Sign-In callback — called by Google's SDK after user authenticates
window.handleGoogleSignIn = async function(response) {
  try {
    const idToken = response.credential;
    // Exchange Google ID token for Ella JWT
    const res = await fetch(`${LLM_CONFIG.ellaApiUrl}/auth/google`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: idToken })
    });
    if (!res.ok) throw new Error('Auth failed: ' + res.status);
    const data = await res.json();
    localStorage.setItem('ella_access_token', data.access_token);
    // Store auth log to show in API Calls tab after reload
    localStorage.setItem('ella_pending_auth_log', JSON.stringify({
      method: 'POST', path: '/auth/google',
      requestBody: { token: '(google id token)' },
      responseBody: { access_token: '(jwt)', token_type: 'bearer', user_id: data.user_id || '' },
      status: '200 OK', timestamp: new Date().toLocaleTimeString()
    }));
    // Decode email from ID token (JWT payload)
    try {
      const payload = JSON.parse(atob(idToken.split('.')[1]));
      localStorage.setItem('ella_google_email', payload.email || 'unknown');
    } catch(_) {}
    // Reload to reinitialize with new token
    window.location.reload();
  } catch(e) {
    alert('Google Sign-In failed: ' + e.message);
  }
};
