<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELLA — Loop Simulator</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js">
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<style>
:root{--ink:#1f1b16;--paper:#fbf7ef;--paper2:#f3ecdf;--green:#3aa655;--green-dk:#23682f;--green-soft:#e6f3e9;
--amber:#c8861a;--amber-soft:#faf0d9;--purple:#5b50c4;--purple-soft:#ecebfb;--blue:#2f6fb0;--blue-soft:#e6f0f9;
--rust:#b8472f;--rule:#d8cfbe;--grey:#8a8678;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper2);color:var(--ink);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:1fr 1fr;gap:0;height:100vh;max-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto;max-height:none}}
.col{display:flex;flex-direction:column;height:100vh;overflow:hidden}
@media(max-width:900px){.col{height:auto;min-height:90vh}}
.left{background:#eaf4ff;border-right:2px solid var(--ink)}
.right{background:var(--paper)}
.bar{padding:10px 14px;border-bottom:2px solid var(--ink);background:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.bar h2{font-size:14px;font-weight:700}
.bar .sp{flex:1}
select,button{font-family:inherit;font-size:12px}
button.act{background:var(--green);color:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
button.act:active{transform:translate(2px,2px);box-shadow:none}
button.act:disabled{opacity:.5;cursor:default}
button.ghost{background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600}
.modeToggle{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.modeToggle button{padding:5px 10px;background:#fff;border:none;cursor:pointer;font-weight:600;font-size:11px}
.modeToggle button.on{background:var(--purple);color:#fff}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;padding:9px 13px;border:2px solid var(--ink);border-radius:14px;font-size:14px;line-height:1.4;box-shadow:2px 2px 0 var(--ink)}
.bub.zoe{background:#fff;align-self:flex-start;border-bottom-left-radius:3px}
.bub.me{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.bub.sys{align-self:center;background:var(--amber-soft);border-style:dashed;font-size:12px;color:#7a5a13;max-width:90%;text-align:center}
.inrow{padding:10px;border-top:2px solid var(--ink);background:#fff;display:flex;gap:8px;flex:none;flex-wrap:wrap}
.inrow input{flex:1;min-width:120px;padding:9px 12px;border:1.5px solid var(--ink);border-radius:8px;font-size:14px}
.tabs{display:flex;gap:4px;padding:8px 10px 0;flex-wrap:wrap;flex:none;background:var(--paper)}
.tab{font-size:11px;font-weight:600;padding:5px 9px;border:1.5px solid var(--ink);border-bottom:none;border-radius:7px 7px 0 0;background:var(--paper2);cursor:pointer}
.tab.on{background:#fff}
.panel{flex:1;overflow-y:auto;padding:14px;background:#fff;border-top:1.5px solid var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.k{color:var(--purple);font-weight:600}
.lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--rust);margin:14px 0 5px}
.lbl:first-child{margin-top:0}
.skill{display:flex;align-items:flex-start;gap:7px;padding:4px 6px;border-radius:5px;font-size:12px;margin-bottom:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
.d-locked{background:#cfc8bb}.d-emerging{background:var(--amber)}.d-owned{background:var(--green)}
.chg{background:var(--green-soft);border:1px solid var(--green);border-radius:6px;padding:6px 9px;margin-bottom:5px;font-size:12px}
.ev{border:1px solid var(--rule);border-radius:7px;padding:8px 10px;margin-bottom:7px;font-size:12px}
.ev .id{font-family:monospace;font-weight:700;font-size:11px}
.ev .conf{float:right;font-weight:700}
.ev .nm{display:block;margin-top:2px;color:#4a443c}
.confbar{height:5px;background:#eee;border-radius:3px;margin-top:5px;overflow:hidden}
.confbar i{display:block;height:100%;background:var(--green)}
.due{border:1.5px solid var(--ink);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px;background:var(--blue-soft)}
.due .b{font-size:10px;font-weight:700;color:var(--blue);text-transform:uppercase}
textarea{width:100%;min-height:150px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5;padding:10px;border:1.5px solid var(--ink);border-radius:8px;resize:vertical}
.hist{font-size:11px;border-bottom:1px solid var(--rule);padding:7px 0}
.hist b{font-family:monospace}
.warn{background:var(--amber-soft);border:1.5px dashed var(--amber);border-radius:8px;padding:8px 11px;font-size:11.5px;margin-bottom:10px;color:#7a5a13}
.statline{font-size:11px;color:var(--grey);padding:4px 14px;background:var(--paper);border-bottom:1px solid var(--rule);flex:none}
.mission{background:#eefbf1;border-bottom:1.5px solid var(--ink);padding:8px 12px;font-size:12.5px;line-height:1.35}
.mission b{color:#214c2d}.mission .starter{margin-top:4px;color:#5f4b00}.mission .mini{font-size:11.5px;color:#6b6257;margin-top:2px}.quickbar{display:flex;gap:6px;flex-wrap:wrap;padding:7px 12px;background:#fff;border-bottom:1.5px dashed #d8cbb7}.quickbar button{font-size:11px}.bub.sys.good{background:#e9f8ec;border-color:#2f7d46;color:#214c2d}
.memfield{margin-bottom:3px}
.coachcard{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:8px 10px;margin-bottom:8px;box-shadow:1.5px 1.5px 0 var(--ink)}
.coachcard .big{font-weight:800;color:var(--green-dk)}
.phasepill{display:inline-block;background:var(--purple-soft);color:var(--purple);border:1px solid var(--purple);border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;margin-left:5px}
.hl{background:#fff6cc;border-radius:3px;transition:background .1s}
small.note{display:block;color:var(--grey);font-size:10.5px;margin-top:6px}
.unit{border:1.5px solid var(--ink);border-radius:10px;margin-bottom:10px;overflow:hidden}
.unit .uh{padding:8px 11px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.unit.active .uh{background:var(--blue);color:#fff}
.unit.done .uh{background:var(--green);color:#fff}
.unit.locked .uh{background:var(--paper2);color:var(--grey)}
.unit .ub{padding:8px 11px;background:#fff}
.ubar{height:7px;background:#eee;border-radius:4px;overflow:hidden;margin:4px 0 8px}
.ubar i{display:block;height:100%;background:var(--green)}
.hit{color:var(--green-dk);font-weight:700}.miss{color:var(--rust);font-weight:700}
/* Garden progress CSS styling */
.garden-map-container { display: flex; flex-direction: column; background: #e8f5e9; border: 1.5px solid var(--ink); border-radius: 12px; padding: 12px; height: 100%; min-height: 500px; box-shadow: 2px 2px 0 var(--ink); overflow: hidden; position: relative; }
.garden-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px dashed var(--ink); padding-bottom: 8px; margin-bottom: 12px; }
.garden-header h3 { margin: 0; color: #2e7d32; font-family: sans-serif; font-size: 16px; font-weight: 700; }
.garden-header .active-badge { background: #c8e6c9; color: #1b5e20; border: 1px solid #81c784; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
.garden-viewport { position: relative; height: 760px; border-radius: 8px; background: #c8e6c9; border: 1px solid #a5d6a7; overflow-y: auto; overflow-x: hidden; padding-bottom: 20px; }
.path-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
.garden-step-node { position: absolute; display: flex; flex-direction: column; width: 380px; height: 260px; z-index: 2; gap: 8px; }
.garden-step-node.step-left { left: 16px; align-items: flex-start; }
.garden-step-node.step-left .step-label { align-self: flex-end; }
.garden-step-node.step-left .raised-bed-tile { align-self: flex-start; }
.garden-step-node.step-right { right: 16px; align-items: flex-end; }
.garden-step-node.step-right .step-label { align-self: flex-start; }
.garden-step-node.step-right .raised-bed-tile { align-self: flex-end; }
.step-label { background: linear-gradient(to bottom, #FFFCF7, #FFF4E2); border: 1.5px solid #E8D4B8; border-radius: 8px; padding: 6px 12px; width: fit-content; min-width: 120px; box-shadow: 0 4px 10px rgba(139, 112, 80, 0.12); z-index: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.step-num { font-size: 9px; font-weight: 800; color: #8b7050; text-transform: uppercase; }
.step-title { font-size: 13px; font-weight: 700; color: #2b1d12; margin: 1px 0; line-height: 1.3; }
.step-focus { font-size: 9px; color: #8b7050; line-height: 1.2; }
.garden-step-node.active .step-label { border-color: #ff9800; box-shadow: 0 4px 12px rgba(255, 152, 0, 0.2); }
.raised-bed-tile { width: 240px; height: 210px; margin: 0; display: flex; justify-content: center; align-items: center; z-index: 3; }
.tile-surface { width: 117px; height: 117px; background: #8d6e63; border: 2px solid #5d4037; border-radius: 12px; box-shadow: 0 6px 0 #3e2723, inset 0 2px 4px rgba(0,0,0,0.15); display: flex; justify-content: center; align-items: center; transform: rotateX(25deg); }
.grid-2x2 { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); width: 100%; height: 100%; padding: 4px; gap: 4px; }
.grid-slot { position: relative; border-radius: 4px; display: flex; justify-content: center; align-items: center; overflow: visible; background: #795548; width: 44px; height: 44px; }
.grid-2x2-iso { position: relative; width: 192px; height: 156px; margin: 0 auto; }
.iso-grid-slot { 
  position: absolute; 
  width: 104px; 
  height: 104px; 
  background: transparent; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  cursor: pointer; 
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s ease;
  will-change: transform;
}

.iso-grid-slot:active {
  transform: translateY(4px) scale(0.96) !important;
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.15)) !important;
  transition: transform 0.05s ease, filter 0.05s ease;
}
.iso-slot-back { top: 0px; left: 44px; z-index: 1; }
.iso-slot-left { top: 22px; left: 0px; z-index: 2; }
.iso-slot-right { top: 22px; left: 88px; z-index: 3; }
.iso-slot-front { top: 44px; left: 44px; z-index: 4; }
.grid-slot.locked { background: #4e342e; opacity: 0.5; }
.slot-soil { position: absolute; width: 80%; height: 80%; background: #3e2723; border-radius: 50%; bottom: 2px; }
.garden-avatar { position: absolute; width: 32px; height: 32px; background: #ff5722; color: #fff; border: 2px solid var(--ink); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 15px; box-shadow: 2px 2px 0 var(--ink); z-index: 10; animation: bounce-avatar 2s infinite; }
@keyframes bounce-avatar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
/* Plants & Sprout CSS */
.plant-overlay {
  transform-origin: bottom center;
  animation: windSway 4s ease-in-out infinite;
}
.iso-slot-left .plant-overlay { animation-delay: -1s; }
.iso-slot-right .plant-overlay { animation-delay: -2s; }
.iso-slot-back .plant-overlay { animation-delay: -3s; }

.iso-grid-slot:active .plant-overlay {
  transform: scaleY(0.78) scaleX(1.15) !important;
  transform-origin: bottom center !important;
  transition: transform 0.05s ease !important;
  animation: none !important;
}

.butterfly-fly {
  animation: butterflyFloat 3.5s ease-in-out infinite;
  transform-origin: center;
}

@keyframes windSway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(2.5deg) skewX(1deg); }
}

@keyframes butterflyFloat {
  0%, 100% { transform: translateY(0) scaleX(1); }
  15% { transform: translateY(-3px) scaleX(0.2); }
  30% { transform: translateY(-7px) scaleX(1); }
  45% { transform: translateY(-10px) scaleX(0.2); }
  60% { transform: translateY(-12px) scaleX(1); }
  75% { transform: translateY(-8px) scaleX(0.2); }
  90% { transform: translateY(-4px) scaleX(1); }
}
.plant-sprout { display: flex; position: absolute; bottom: 8px; align-items: flex-end; }
.leaf-left, .leaf-right { width: 8px; height: 12px; background: #4caf50; border-radius: 0 8px; transform: rotate(-35deg); transform-origin: bottom right; }
.leaf-right { border-radius: 8px 0; transform: rotate(35deg); transform-origin: bottom left; margin-left: -2px; }
.plant-stem { width: 3px; height: 22px; background: #4caf50; border-radius: 2px; position: absolute; bottom: 6px; }
.plant-stem.tall { height: 34px; }
.plant-bud { width: 10px; height: 12px; border-radius: 5px 5px 0 0; position: absolute; bottom: 26px; animation: pulse-bud 1.5s infinite ease-in-out; }
@keyframes pulse-bud { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.plant-bloom { position: absolute; bottom: 34px; width: 22px; height: 22px; display: flex; justify-content: center; align-items: center; }
.petal { position: absolute; width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,0.1); animation: spin-petal 10s infinite linear; }
.petal-center { position: absolute; width: 8px; height: 8px; border-radius: 50%; z-index: 2; border: 1px solid rgba(0,0,0,0.1); }
@keyframes spin-petal { 100% { transform: rotate(360deg); } }
</style>
</head>

nd school."], ["A1-VOC-02", "A1", "VOC", "I can use words to describe past events and experiences."], ["A1-VOC-03", "A1", "VOC", "I can use opinion words \u2014 I think, I feel, I believe, in my opinion."], ["A1-VOC-04", "A1", "VOC", "I can use linking words \u2014 and, but, because, so, then."], ["A1-VOC-05", "A1", "VOC", "I can understand and use common phrases in conversation."], ["A1-VOC-06", "A1", "VOC", "I have enough words to talk about everyday topics and express how I feel."], ["A1-VOC-07", "A1", "VOC", "I can use words for feelings \u2014 excited, nervous, proud, bored."], ["A1-GRA-01", "A1", "GRA", "I can talk about the past using past simple \u2014 I went, I ate, I saw."], ["A1-GRA-02", "A1", "GRA", "I can use 'going to' to talk about future plans."], ["A1-GRA-03", "A1", "GRA", "I can use comparative adjectives \u2014 bigger, faster, more interesting."], ["A1-GRA-04", "A1", "GRA", "I can use 'can' and 'can't' to talk about ability."], ["A1-GRA-05", "A1", "GRA", "I can use 'should' to give simple advice."], ["A1-GRA-06", "A1", "GRA", "I can use 'there is' and 'there are' to describe places."], ["A1-GRA-07", "A1", "GRA", "I can ask questions using who, what, where, when, and why."], ["A1-FLU-01", "A1", "FLU", "I can hold a short conversation on familiar topics without long silences."], ["A1-FLU-02", "A1", "FLU", "I can understand the main point even when I don't catch every word."], ["A1-FLU-03", "A1", "FLU", "I can use simple phrases to buy time \u2014 'let me think', 'I mean'."], ["A1-FLU-04", "A1", "FLU", "I can repair a conversation when I make a mistake."], ["A1-FLU-05", "A1", "FLU", "I can speak at a slow but steady pace on topics I know well."], ["A1-FLU-06", "A1", "FLU", "I can talk about my daily life, interests, and opinions \u2014 and it feels like a real conversation."], ["A2-VOC-01", "A2", "VOC", "I can discuss topics like health, education, and technology in simple terms."], ["A2-VOC-02", "A2", "VOC", "I can use more specific words to make my ork to words that feel right.", "skills": [{"id": "U1-VOC-01", "strand": "VOC", "text": "I can use a wider range of descriptive words to make my ideas more interesting."}, {"id": "U1-VOC-02", "strand": "VOC", "text": "I can understand and use common idioms I hear regularly."}, {"id": "U1-GRA-01", "strand": "GRA", "text": "I can use present perfect to connect past and present \u2014 I've lived here for 3 years."}, {"id": "U1-FLU-01", "strand": "FLU", "text": "I can express an idea in more than one way when I'm not sure of a word."}]}, {"step": "2", "name": "Talking about the past with more precision", "focus": "Describing not just what happened, but what was happening and what used to be.", "skills": [{"id": "U2-VOC-01", "strand": "VOC", "text": "I can use sequence and contrast words \u2014 however, although, even though."}, {"id": "U2-GRA-01", "strand": "GRA", "text": "I can use past continuous with past simple \u2014 I was eating when she called."}, {"id": "U2-GRA-02", "strand": "GRA", "text": "I can use 'used to' to talk about past habits."}, {"id": "U2-FLU-01", "strand": "FLU", "text": "I can tell a story that moves naturally between past and present."}]}, {"step": "3", "name": "Expressing opinions with depth", "focus": "Moving from simple opinions to supported arguments.", "skills": [{"id": "U3-VOC-01", "strand": "VOC", "text": "I can use reporting words \u2014 I think, I believe, in my opinion, it seems to me."}, {"id": "U3-GRA-01", "strand": "GRA", "text": "I can use first conditional \u2014 If I study hard, I will pass."}, {"id": "U3-GRA-02", "strand": "GRA", "text": "I can use modal verbs \u2014 might, could, should, must \u2014 with reasonable accuracy."}, {"id": "U3-FLU-01", "strand": "FLU", "text": "I can give an opinion, support it with a reason, and add an example."}]}, {"step": "4", "name": "Speaking for longer without losing the thread", "focus": "Building up to a full minute of organised, connected speech.", "skills": [{"id": "U4-VOC-01", "strand": " <script type="text/babel" data-presets="react">
const {useState,useRef,useEffect}=React;

const SKILLS = CAT.map(r=>({id:r[0],level:r[1],strand:r[2],text:r[3]}));
const byLevel = lvl => SKILLS.filter(s=>s.level===lvl);
const STRANDS={VOC:'Vocabulary',GRA:'Grammar',FLU:'Fluency'};
// flatten units into a lookup: id -> {text,strand,step,stepName}
const UNIT_SKILLS={};
const UNIT_SKILLS_BY_LEVEL={};
Object.entries(UNITS).forEach(([lvl, uList]) => {
  if (!UNIT_SKILLS_BY_LEVEL[lvl]) UNIT_SKILLS_BY_LEVEL[lvl] = {};
  uList.forEach(u => u.skills.forEach(s => {
    if (!UNIT_SKILLS[s.id]) {
      UNIT_SKILLS[s.id] = {...s, step: u.step, stepName: u.name, level: lvl};
    }
    UNIT_SKILLS_BY_LEVEL[lvl][s.id] = {...s, step: u.step, stepName: u.name, level: lvl};
  }));
});
function skillText(id, level = null){
  const s=SKILLS.find(x=>x.id===id); if(s)return s.text;
  if(level && UNIT_SKILLS_BY_LEVEL[level] && UNIT_SKILLS_BY_LEVEL[level][id]) return UNIT_SKILLS_BY_LEVEL[level][id].text;
  if(UNIT_SKILLS[id])return UNIT_SKILLS[id].text;
  return id;
}
function skillMeta(id, level = null){ return SKILLS.find(x=>x.id===id) || (level && UNIT_SKILLS_BY_LEVEL[level] && UNIT_SKILLS_BY_LEVEL[level][id]) || UNIT_SKILLS[id] || {id,strand:strandOf(id,level),text:skillText(id,level)}; }
const ELICITATION_BY_FUNCTION={
  describe:{
    move:'Ask the learner to describe a real or imagined place/person/picture. Do not ask only yes/no.',
    question:'Tell me about your room/park/classroom. What can you see? Who is there? What are they doing?',
    fallback:'If they give one word, ask: Good. Say one more thing. What colour/size is it? Where is it?',
    evidence:'3 details, simple adjectives, or 2-4 connected fragments/sentences.'
  },
  present_continuous:{
    move:'Create a "right now / picture" moment so the learner can use is/are + -ing.',
    question:'Imagine a picture. What is the boy doing? What are the people doing?',
    fallback:'If stuck, offer a frame: He is ___. They are ___.',
    evidence:'Any meaningful present-continuous attempt, even with errors: “boy running”, “she is play”.'
  },
  past:{
    move:'Ask about yesterday/last weekend and invite a tiny sequence.',
    question:'What did you do yesterday? Tell me two things.',
    fallback:'If they answer one word, ask: First? Then?',
    evidence:'Past-time expression or past event, even if tense is imperfect.'
  },
  opinion:{
    move:'Ask preference plus reason; keep it personal and easy.',
    question:'Which do you like more? Why?',
    fallback:'Offer a frame: I like ___ because ___.',
    evidence:'Opinion word/preference plus any reason.'
  },
  future:{
    move:'Ask about tomorrow/weekend plans using going to/will/want to.',
    question:'What will you do tomorrow or this weekend?',
    fallback:'Offer a frame: I am going to ___.',
    evidence:'Future plan/intention, even with errors.'
  },
  sequence:{
    move:'Ask for beginning-middle-end of a small story.',
    question:'Tell me what happened first, then, and at the end.',
    fallback:'Ask one step at a time: First? Then?',
    evidence:'2-3 ordered events or connectors.'
  },
  self_intro:{
    move:'Ask for name, age, and where they are from in a friendly first-meeting flow.',
    question:'What is your name? How old are you? Where are you from?',
    fallback:'If they answer only name, continue gently: Nice to meet you. How old are you?',
    evidence:'Name, age, place, or an attempt to introduce themselves.'
  },
  everyday:{
    move:'Ask about a familiar routine/object/person and gently extend.',
    question:'Tell me about it. What do you do? Who is with you?',
    fallback:'If one word, ask a choice question then one follow-up.',
    evidence:'Relevant answer that keeps the exchange alive.'
  }
};
function elicitationFunction(id, level = null){
  const u=(level && UNIT_SKILLS_BY_LEVEL[level] && UNIT_SKILLS_BY_LEVEL[level][id]) || UNIT_SKILLS[id];
  if(u){
    if(u.step==='1') return u.strand==='GRA'?'present_continuous':'describe';
    if(u.step==='2') return 'past';
    if(u.step==='3') return 'opinion';
    if(u.step==='4') return 'future';
    if(u.step==='5') return 'sequence';
  }
  const s=SKILLS.find(x=>x.id===id); if(!s)return 'everyday';
  const txt=s.text.toLowerCase();
  if(txt.includes('age')||txt.includes("where i'm from")||txt.includes('where i am from')) return 'self_intro';
  if(txt.includes('past')||txt.includes('yesterday')||txt.includes('story')) return 'past';
  if(txt.includes('opinion')||txt.includes('prefer')||txt.includes('because')||txt.includes('reason')) return 'opinion';
  if(txt.includes('future')||txt.includes('plan')||txt.includes('will')) return 'future';
  if(txt.includes('describe')||txt.includes('adjective')||txt.includes('look like')) return 'describe';
  if(txt.includes('conversation')||txt.includes('exchange')||txt.includes('keep')) return 'everyday';
  return 'everyday';
}
function skillPlan(id, level = null){
  const fn=elicitationFunction(id, level), plan=ELICITATION_BY_FUNCTION[fn]||ELICITATION_BY_FUNCTION.everyday;
  return {id,fn,...plan,skill:skillText(id, level)};
}
function planText(ids, level = null){
  if(!ids||!ids.length)return 'No specific target. Keep the learner talking and listen for interests.';
  return ids.map((id,i)=>{const p=skillPlan(id, level); return `${i===0?'PRIMARY':'WATCH'} ${id} (${p.fn})
- Skill: ${p.skill}
- Elicitation move: ${p.move}
- Strong question: ${p.question}
- If short/stuck: ${p.fallback}
- Judgeable evidence: ${p.evidence}`;}).join('\n\n');
}
function missReason(score, level = null){
  const c=Number(score&&score.confidence||0);
  const bar = level ? ownBar(level) : 0.7;
  if(c>=bar)return 'Strong evidence; counts as a qualifying sighting.';
  if(c>=FLOOR)return 'Partial evidence; mark emerging but ask one more scaffolded follow-up next time.';
  if(score&&score.evidence)return 'Evidence too weak for this target; Zoe should elicit a clearer answer.';
  return 'No evidence found. Likely Zoe did not create a chance, learner stayed off-target, or the chat was too short.';
}
function sentenceStarterFor(id, level = null){
  const p=skillPlan(id, level), fn=p.fn;
  if(fn==='self_intro') return "My name is __. I am __. I am from __.";
  if(fn==='describe') return "I can see __. It is __. A person is __.";
  if(fn==='present_continuous') return "He is __. She is __. They are __.";
  if(fn==='opinion') return "I like __ because __.";
  if(fn==='past') return "Yesterday, I __. Then I __.";
  if(fn==='future') return "Tomorrow, I will __. I want to __.";
  return "I see __. I like __. It is __.";
}
function studentMission(id, level = null){
  if(!id) return {title:'Talk with Zoe', micro:'Answer in English. Small answers are okay.', starter:'I think __.'};
  const p=skillPlan(id, level);
  return {title:p.skill.replace(/^I can /,'Try to '), micro:p.question, starter:sentenceStarterFor(id, level)};
}
function supportIntent(text){
  const t=(text||'').toLowerCase();
  if(/easier|easy|simple|help|stuck|don't know|dont know|samajh|hindi/.test(t)) return 'easier';
  if(/example|sample|show me/.test(t)) return 'example';
  if(/repeat|again|say again/.test(t)) return 'repeat';
  if(/boring|bored|tired|sad|angry|shy|scared|nervous/.test(t)) return 'affect';
  return null;
}
function sessionStage(turns){
  if(turns<=0) return 'warm-up';
  if(turns<=2) return 'target practice';
  if(turns<=4) return 'extension';
  return 'recap / close';
}
function chatGoalFor(primary, topic, level = null){
  if(!primary) return {phase:'warm-up', aim:'Help the learner answer in English.', success:'Learner says anything meaningful in English.', easier:'Give a choice question.'};
  const p=skillPlan(primary, level);
  return {phase:'warm-up', primary, topic:topic?topic.topic:null, aim:p.skill, success:p.evidence, strong:p.question, easier:p.fallback.replace(/^If[^:]*:\s*/,''), starter:sentenceStarterFor(primary, level)};
}
function learnerRecap(scores, aimed, level = null){
  const strong=(scores||[]).filter(s=>aimed.includes(s.id)&&Number(s.confidence)>=0.7);
  if(strong.length) return 'You did it — I heard clear evidence for '+strong.map(s=>skillText(s.id, level).replace(/^I can /,'')).join('; ')+'.';
  return 'Good try. Next time Zoe will make the question smaller.';
}
function readinessScore({hasMission,hasArc,hitRate,liveOk,judgeOk,hasMemory,hasHelp}){
  let score=0;
  if(hasMission) score+=1.2;
  if(hasArc) score+=1.4;
  if(hitRate>=0.8) score+=2.0; else if(hitRate>=0.5) score+=1.2;
  if(liveOk) score+=1.2;
  if(judgeOk) score+=1.2;
  if(hasMemory) score+=1.0;
  if(hasHelp) score+=1.0;
  return Math.min(9.0, Math.round(score*10)/10);
}
function extractProfileSignals(mem,msgs){
  const m=JSON.parse(JSON.stringify(mem));
  const learner=msgs.filter(x=>x.role==='me').map(x=>x.text).join(' ');
  const name=learner.match(/(?:my name is|i am|i'm)\s+([A-Z][a-z]{2,})/i);
  if(name&&!/^(happy|sad|tired|hungry|eleven|ten|nine|eight|seven|six)$/i.test(name[1])) m.name=m.name||name[1];
  const age=learner.match(/(?:i am|i'm|age is)\s+(\d{1,2}|six|seven|eight|nine|ten|eleven|twelve|thirteen)/i);
  const words={six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13};
  if(age){ const v=words[age[1].toLowerCase()]||parseInt(age[1],10); if(v>2&&v<20)m.age=m.age||v; }
  const city=learner.match(/(?:i am from|i'm from|from)\s+([A-Z][a-zA-Z ]{1,24})(?:[\.!,;]|$)/i);
  if(city && !m.city) m.city=city[1].trim();
  const likes=[...learner.matchAll(/(?:i like|i love|my favourite|my favorite|favorite)\s+([^\.!,;]+)/gi)].map(x=>x[1].trim()).filter(Boolean).slice(0,3);
  if(likes.length){ const old=m.interests?m.interests.split(',').map(x=>x.trim()).filter(Boolean):[]; m.interests=Array.from(new Set([...old,...likes])).slice(0,8).join(', '); }
  return m;
}

const DEFAULT_PROMPTS = {

`You are Zoe, a warm, encouraging AI English tutor for a language-learning app.
You are a friendly green backpack character with round glasses.

ABSOLUTE RULES (never break, any level):

`TODAY'S UNIT: "{{UNITNAME}}" — {{UNITFOCUS}}
Steer the whole conversation around this theme so the learner naturally practises it.

TEACHER INVISIBLE PLAN — use this to elicit judgeable evidence without sounding like a quiz:
{{ELICITATION}}

  judge:
`You are an examiner scoring a language-learning conversation. You will be given:
the learner's level, a list of target "I can" skills (with IDs), and the transcript.

For EACH skill in the list, output STRICT JSON only (no prose):
{"scores":[{"id":"<id>","confidence":<0..1>,"prompted":<bool>,"evidence":"<short learner quote or ''>"}]}

RULES:
- Score ONLY the learner's language, not Zoe's prompt.
- confidence 0..1 = strength of evidence in the learner's transcript.
- These thresholds matter downstream: >=0.7 means qualifying sighting/evidence; <0.7 = ignored.
- If confidence <0.70, it is ignored and not graded.
- Output JSON only.`
};

// ---------- engine ----------
const FLOOR=0.7;
// ownership bar SCALES with level: a beginner owns by being understood; advanced by being accurate
const OWN_BAR={A0:0.55,A1:0.60,A2:0.68,B1:0.72,B2:0.75,C1:0.78};
const SIGHTINGS_TO_OWN=3;   // corroboration: need >=3 qualifying sightings (across chats) to own
function ownBar(level){ return OWN_BAR[level]||0.7; }
function bucketOf(mem,id){ if(mem.owned.includes(id))return'owned'; if(mem.emerging.includes(id))return'emerging'; return'locked'; }
function strandOf(id){ const s=SKILLS.find(x=>x.id===id); if(s)return s.strand; if(UNIT_SKILLS[id])return UNIT_SKILLS[id].strand; return 'VOC'; }

function timeAgo(dateStr) {
  if (!dateStr) return '';
  try {
    const date = new Date(dateStr);
    const now = new Date();
    const diffMs = now - date;
    if (isNaN(diffMs)) return '';
    const diffMins = Math.floor(diffMs / 60000);
    if (diffMins < 1) return 'just now';
    if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
    const diffDays = Math.floor(diffHours / 24);
    if (diffDays < 30) return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
    const diffMonths = Math.floor(diffDays / 30);
    return `${diffMonths} month${diffMonths > 1 ? 's' : ''} ago`;
  } catch (e) {
    return '';
  }
}

function applyMerge(mem, scores, level){
  const m=JSON.parse(JSON.stringify(mem)); const changes=[];
  scores.forEach(sc=>{
    const prior=bucketOf(m,sc.id); let next=prior;
    const qualifies = sc.confidence>=ownBar(level);   // a "qualifying sighting"
    // count sightings + effort
    if(sc.confidence>=FLOOR){
      m.last_seen[sc.id]=new Date().toISOString().slice(0,10);
      if(qualifies) m.sightings[sc.id]=(m.sightings[sc.id]||0)+1;
      if(!sc.prompted) m.strength[sc.id]=(m.strength[sc.id]||0)+1;
    }
    const sightings=m.sightings[sc.id]||0;
    // promotion needs corroboration: >=SIGHTINGS_TO_OWN qualifying sightings,
    // OR effort path at low levels (3 honest attempts even if not all qualifying)
    const effortPath = (level==='A0'||level==='A1') && (m.strength[sc.id]||0)+ (m.sightings[sc.id]||0) >=3 && sc.confidence>=FLOOR;
    if(sc.confidence<FLOOR){ next=prior; }
    else if(prior==='locked'){ next='emerging'; }
    else if(prior==='emerging' && (sightings>=SIGHTINGS_TO_OWN || effortPath)){ next='owned'; }
    if(next!==prior){
      changes.push({id:sc.id,from:prior,to:next});
      if(prior==='locked') m.emerging.push(sc.id);
      if(prior==='emerging' && next==='owned'){ m.emerging=m.emerging.filter(x=>x!==sc.id); m.owned.push(sc.id); }
    }
  });
  return {mem:m,changes};
}

// ----- due_next: ONE primary + a small watch-list (judge also scores adjacent/spontaneous skills) -----
function dueSkill(mem, level){
  const lvl=byLevel(level).map(s=>s.id); const picks=[]; const why=[];
  const em=mem.emerging.find(id=>lvl.includes(id)); if(em){picks.push(em);why.push('finish what is started (emerging)');}
  const so={VOC:0,GRA:0,FLU:0}; mem.owned.forEach(id=>{const s=SKILLS.find(x=>x.id===id);if(s&&s.level===level)so[s.strand]++;});
  const order=Object.keys(so).sort((a,b)=>so[a]-so[b]);
  for(const st of order){ const n=byLevel(level).find(s=>s.strand===st&&bucketOf(mem,s.id)==='locked'&&!picks.includes(s.id)); if(n){picks.push(n.id);why.push('open weakest strand: '+STRANDS[st]);break;} }
  const fav=mem.owned.find(id=>lvl.includes(id)&&!picks.includes(id)); if(fav){picks.push(fav);why.push('familiar favourite (owned)');}
  return picks.map((id,i)=>({id,why:why[i]}));
}
function activeStep(mem){
  const uList = UNITS[mem.level] || UNITS["A1"] || []; for(const u of uList){ if(!unitComplete(mem,u)) return u; }
  return null;
}
// COMMUNICATE-TO-ADVANCE gate: a unit completes when its FLU+VOC skills are owned
// AND its GRA skills are at least emerging (attempted, not locked). Grammar matures later.
function unitComplete(mem,u){
  for(const s of u.skills){
    const b=bucketOf(mem,s.id);
    if((s.strand==='FLU'||s.strand==='VOC') && b!=='owned') return false;
    if(s.strand==='GRA' && b==='locked') return false; // must be at least emerging
  }
  return true;
}
function dueUnit(mem){
  const u=activeStep(mem); if(!u)return {step:null,picks:[]};
  // primary = first unowned FLU/VOC (the communicative core), then unowned grammar
  const order=u.skills.slice().sort((a,b)=>{
    const rank=x=> x.strand==='GRA'?2 : x.strand==='FLU'?0:1; return rank(a)-rank(b);
  });
  const picks=order.filter(s=>bucketOf(mem,s.id)!=='owned').map(s=>({id:s.id,why:'unit "'+u.name+'" · '+s.strand}));
  return {step:u,picks};
}
function stepProgress(mem,u){ const owned=u.skills.filter(s=>mem.owned.includes(s.id)).length; return {owned,total:u.skills.length}; }

// ----- topic layer: pick a fresh topic for the target skill, avoiding recent ones -----
// Topic affinity: which topics best elicit which grammatical function.
// Grounded in task-based teaching — a topic that naturally pulls the target structure.
// Keys are A1 topic names; values are the function tags a topic elicits well.
const TOPIC_AFFINITY={
  "My family":["describe","present_continuous"],
  "Animals":["describe","present_continuous"],
  "My home":["describe","present_continuous"],
  "Colours, numbers, and shapes":["describe"],
  "Festivals I celebrate":["past","future","sequence","opinion"],
  "My daily routine":["past","frequency","future","sequence"],
  "Food I like":["opinion","past"],
  "Things I like and don't like":["opinion"],
  "Sports and games":["opinion","present_continuous"],
  "My school":["future","present_continuous"],
  "My name and where I'm from":["self_intro"]
};
// Map a target skill's step+strand to the function it most needs.
function skillFunction(skillId, level = null){
  const u=(level && UNIT_SKILLS_BY_LEVEL[level] && UNIT_SKILLS_BY_LEVEL[level][skillId]) || UNIT_SKILLS[skillId]; if(!u) return elicitationFunction(skillId, level);
  const step=u.step, strand=u.strand;
  if(step==='1') return strand==='GRA'?'present_continuous':'describe';
  if(step==='2') return 'past';
  if(step==='3') return 'opinion';
  if(step==='4') return 'future';
  if(step==='5') return 'sequence';
  return null;
}
function pickTopic(mem, targetSkill, apiTopics = []){
  if (LLM_CONFIG.mode === 'api' && apiTopics && apiTopics.length > 0) {
    const bank = apiTopics;
    const recent = mem.units || mem.last_topics || [];
    const fresh = bank.filter(t => !recent.includes(t.name));
    const pool = fresh.length ? fresh : bank;
    let pick = pool[Math.floor(Math.random() * pool.length)];
    return {
      theme: "Curriculum",
      topic: pick.name,
      starters: pick.structure_targets ? pick.structure_targets.join(" / ") : ""
    };
  }

  const bank=TOPICS[mem.level]||TOPICS['A1']||[];
  if(!bank.length) return null;
  const recent=mem.units||mem.last_topics||[];
  let pool=bank.filter(t=>!recent.includes(t.topic));
  if(!pool.length) pool=bank; // all used recently → allow reuse
  // 1) prefer topics that ELICIT the target skill's function (skill-aware)
  const fn=targetSkill?skillFunction(targetSkill, mem.level):null;
  if(targetSkill==='A1-VOC-01'){
    const exact=bank.find(t=>t.topic==="My name and where I'm from");
    if(exact && !recent.includes(exact.topic)) return exact;
  }
  if(fn){
    const fit=pool.filter(t=>(TOPIC_AFFINITY[t.topic]||[]).includes(fn));
    if(fit.length) pool=fit;
  }
  // 2) among those, prefer one matching the learner's interests
  const intr=(mem.interests||'').toLowerCase();
  let pick=pool.find(t=>intr && (intr.includes(t.topic.toLowerCase().split(' ')[0]) || (t.theme&&intr.includes(t.theme.toLowerCase()))));
  if(!pick) pick=pool[Math.floor(Math.random()*pool.length)];
  return pick;
}

const PROVIDER_URLS = {
  openrouter:'https://openrouter.ai/api/v1/chat/completions',
  deepseek:'https://api.deepseek.com/chat/completions',
  openai:'https://api.openai.com/v1/chat/completions',

async function callLLM(prompt, role){
  role = role||'conv';
  const cfg = LLM_CONFIG[role] || LLM_CONFIG.conv;
  
  let activeMode = LLM_CONFIG.mode;
  if (activeMode === 'api') {
    if (cfg.key) {
      activeMode = 'direct';
    } else if (LLM_CONFIG.proxyUrl) {
      activeMode = 'proxy';
    } else {
      activeMode = 'runtime';
    }
  }

  // 1) runtime (Claude.ai artifact channel) — default, works only inside Claude.ai
  if(activeMode==='runtime'){
    try{ if(window.claude && window.claude.complete){ const r=await window.claude.complete(prompt); return {ok:true,text:r}; } }
    catch(e){ return {ok:false,text:'',err:String(e)}; }
    return {ok:false,text:'',err:'runtime channel unavailable (open inside Claude.ai, or switch mode in ⚙︎)'};
  }
  // build an OpenAI-compatible request body
  const body = JSON.stringify({ model:cfg.model||'', messages:[{role:'user',content:prompt}], temperature:0.7, max_tokens:1000 });
  // 2) proxy — your backend holds the key; works for ALL providers
  if(activeMode==='proxy'){
    try{
      const r=await fetch(LLM_CONFIG.proxyUrl,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({role,provider:cfg.provider,model:cfg.model,prompt})});
      if(!r.ok) return {ok:false,text:'',err:'proxy '+r.status};
      const j=await r.json(); return {ok:true,text:j.text||j.completion||''};
    }catch(e){ return {ok:false,text:'',err:'proxy unreachable: '+e}; }
  }
  // 3) direct browser → provider (works only for CORS-permissive providers, e.g. OpenRouter)
  try{
    const url=PROVIDER_URLS[cfg.provider]||cfg.provider;
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body});
    if(!r.ok){ const t=await r.text(); return {ok:false,text:'',err:'HTTP '+r.status+' '+t.slice(0,120)}; }
    const j=await r.json();
    const txt=j.choices&&j.choices[0]&&j.choices[0].message?j.choices[0].message.content:'';
    return {ok:true,text:txt};
  }catch(e){ return {ok:false,text:'',err:'direct call blocked (likely CORS): '+e}; }
}

  async function callEllaAPI(path, method = 'GET', body = null) {
    const logId = 'log_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
    const timestamp = new Date().toLocaleTimeString();
    
    const newLog = {
      id: logId,
      timestamp,
      method,
      path,
      requestBody: body,
      responseBody: null,
      status: 'pending...'
    };
    setApiLogs(prev => [newLog, ...prev]);

    const url = `${LLM_CONFIG.ellaApiUrl}${path}`;
    let token = localStorage.getItem('ella_access_token');
    
    const headers = { 'Content-Type': 'application/json' };
    if (token) {
      headers['Authorization'] = `Bearer ${token}`;
    }

    const options = {
      method,
      headers,
    };
    if (body) {
      options.body = JSON.stringify(body);
    }

    try {
      const res = await fetch(url, options);
      const statusText = `${res.status} ${res.statusText}`;
      
      let resJson;
      const text = await res.text();
      try {
        resJson = JSON.parse(text);
      } catch (e) {
        resJson = text;
      }

      setApiLogs(prev => prev.map(log => {
        if (log.id === logId) {
          return { ...log, status: statusText, responseBody: resJson };
        }
        return log;
      }));

      if (!res.ok) {
        if (res.status === 401 && token) {
          localStorage.removeItem('ella_access_token');
          window.location.reload();
        }
        throw new Error(`API Error ${res.status}: ${text}`);
      }
      return resJson;
    } catch (err) {
      setApiLogs(prev => prev.map(log => {
        if (log.id === logId) {
          return { ...log, status: 'Failed', responseBody: err.message };
        }
        return log;
      }));
      throw err;
    }
  }

  function collectCustomPrompts() {
    const result = {};

    textareas.forEach(ta => {
      const key = ta.getAttribute('data-promptkey');
      if (key && ta.value && ta.value.trim()) {
        result[key] = ta.value.trim();
        if (key === 'profile-A1') {
          result['profile-A2'] = ta.value.trim();
        }
        if (key === 'profile-B1') {
          result['profile-B2'] = ta.value.trim();
          result['profile-C1'] = ta.value.trim();
        }
      }
    });
    // Fallback conversation template
    if (!result['conversation'] && typeof serverPrompts !== 'undefined' && serverPrompts && serverPrompts.conversation) {
      result['conversation'] = serverPrompts.conversation;

    return Object.keys(result).length > 0 ? result : null;

    } else {

      )}
      <div className="chat" ref={chatRef}>

          // ── Per-turn rule checker for Zoe bubbles ──────────────────────────

          let ruleOk = [];
          if (m.role === 'zoe') {
            // Skip rule checker during placement — placement uses its own prompt
            // with completely different rules (no word limits, no echo requirement)
            if (sessionType === 'placement') {
              ruleColor = '#9e9e9e';

            const words = m.text.trim().split(/\s+/).filter(Boolean);
            const wc = words.length;
            const txt = m.text;
            // Word count limits per level
            const limits = {A0:[3,6], A1:[4,18], A2:[4,20], B1:[6,35], B2:[6,40], C1:[6,45]};
            const [minW, maxW] = limits[level] || [4, 35];
            if (wc < minW) ruleIssues.push(`too short (${wc}w, min ${minW})`);
            else if (wc > maxW) ruleIssues.push(`too long (${wc}w, max ${maxW})`);
            else ruleOk.push(`${wc} words ✓`);
            // Open question check for A0 (should be yes/no or this-or-that only)
            const openQWords = /\b(what|why|how|tell me|describe|explain|where|when|who)\b/i;

            if (level === 'A0' && hasQuestion && openQWords.test(txt)) {

            // Stacked questions check (more than 1 question mark)
            const qCount = (txt.match(/\?/g)||[]).length;
            if (qCount > 1) ruleIssues.push(`stacked ${qCount} questions`);
            // Echo check for A0 (should prompt repetition)

            if ((level === 'A0' || level === 'A1') && correctionWords.test(txt)) {

            }
            ruleColor = ruleIssues.length === 0 ? '#2e7d32' : ruleIssues.some(x=>x.includes('too long')||x.includes('open question')||x.includes('correction')) ? '#c62828' : '#e65100';

 {tab==='prompt'&&<PromptView text={buildConvPrompt(msgs)} level={level} tabActive={tab==='prompt'} sessionType={sessionType} mem={mem} prompts={prompts} lastSystemPrompt={lastSystemPrompt}/>}

function RM({t,children}){return <div style={{marginBottom:14}}><div className="lbl">{t}</div>{children}</div>;}
function ReadmeView(){
  const p={fontSize:13.5,lineHeight:1.6,color:'#3a352e',marginBottom:8};
  const code={fontFamily:'monospace',background:'#f0ece2',padding:'1px 5px',borderRadius:4,fontSize:12};
  const li={fontSize:13,lineHeight:1.55,marginBottom:5,color:'#3a352e'};
  return(<div style={{maxWidth:640}}>
    <div style={{fontFamily:'Georgia,serif',fontSize:21,fontWeight:700,color:'#1f1b16',marginBottom:4}}>ELLA Loop Simulator — read me first</div>
    <div style={{fontSize:11,color:'#8a8678',marginBottom:8}}>Last edited on: <b>July 03, 2026, 05:02 PM IST</b> · Version: <b>auto-save & UX alignment</b> · Voice excluded from this rating</div>
    <p style={p}>This is a <b>glass box</b>. The left side is what a learner sees (a chat with Zoe). The right side exposes everything normally hidden — the prompts, the scoring, the memory, the progression. The point is to <i>watch the learning loop work and decide if it's right</i>, not to be a polished app.</p>
    <div className="coachcard"><div className="big">What changed most recently</div><div>The simulator was upgraded from a working adaptive loop into a colleague-demo-ready learning simulator: clearer learner mission, mini-lesson arc, help/example buttons, stuck/emotion handling, stronger Zoe steering, improved default prompts in the Prompts tab, better child-facing recap, and a visible “what changed” section in this README.</div></div>

    <RM t="The loop, in one breath">
      <p style={p}>A learner talks to Zoe → after the chat a <b>judge</b> scores which skills were shown → deterministic code updates the <b>memory object</b> → that decides what the next chat aims at. Round and round. <b>LLMs produce signals (Zoe talks, judge scores); plain code makes the decisions (what's owned, what's next).</b> An LLM never decides state.</p>
    </RM>

    <RM t="How to drive it (try this first)">
      <ol style={{margin:'0 0 0 18px'}}>
        <li style={li}>Pick a <b>mode</b> top-left: <b>micro-skill</b> (flat list of skills) or <b>units</b> (your colleague's 4-step journey). Try units.</li>
        <li style={li}>Hit <b>🤖 auto</b>, then <b>Next turn ▶</b> a few times — a simulated learner talks to Zoe so you don't have to type.</li>
        <li style={li}>Hit <b>End chat &amp; judge ⚖️</b> — watch the right side update.</li>
        <li style={li}>Hit <b>Next chat →</b> and repeat 5–10 times. Watch the <b>📊 History</b> and <b>🧠 Memory</b> tabs to see the arc.</li>
        <li style={li}>To use a real LLM (and let colleagues run it), see <b>⚙︎ LLM</b>.</li>
      </ol>
    </RM>

    <RM t="What each glass-box tab shows">
      <ul style={{margin:'0 0 0 16px'}}>
        <li style={li}><b>🧠 Memory</b> — the learner's whole state, live. Changed fields flash yellow after judging.</li>
        <li style={li}><b>⚖️ Judge</b> — the raw per-skill scores from the last chat (confidence + evidence quote).</li>
        <li style={li}><b>⚖️⚖️ Both</b> — the same transcript scored under <i>both</i> models, side by side.</li>
        <li style={li}><b>📄 Session</b> — the immutable record written each chat (accumulates; memory overwrites).</li>
        <li style={li}><b>🎯 due_next</b> — what the next chat is aimed at, and why.</li>
        <li style={li}><b>📝 Prompt</b> — the exact prompt Zoe is running on right now.</li>
        <li style={li}><b>✏️ Prompts</b> — edit any prompt live and re-run to see the effect.</li>
        <li style={li}><b>🪜 Units / 🌱 Skills</b> — the curriculum and what's owned.</li>
        <li style={li}><b>⚙︎ LLM</b> — switch which model powers Zoe and the judge.</li>
      </ul>
    </RM>

    <RM t="Every memory parameter, explained">
      <ul style={{margin:'0 0 0 16px'}}>
        <li style={li}><span style={code}>profile</span> — name, age, grade, home_language. For personalisation &amp; tone. (Sensitive if a minor — handle with care in production.)</li>
        <li style={li}><span style={code}>level</span> — current CEFR band (A1…C2).</li>
        <li style={li}><span style={code}>owned</span> — skills demonstrated enough to count as learned.</li>
        <li style={li}><span style={code}>emerging</span> — skills seen at least once but not yet owned ("started, not finished").</li>
        <li style={li}><span style={code}>due_next</span> — <b>{'{primary, watching[]}'}</b>. <i>primary</i> = the one skill Zoe actively steers toward; <i>watching</i> = a couple the judge also looks for if they come up.</li>
        <li style={li}><span style={code}>units</span> — recent units/topics practiced. <b>Load-bearing:</b> the topic-picker avoids these so chats don't repeat.</li>
        <li style={li}><span style={code}>interests</span> — what the learner likes; feeds topic selection. Grows by listening to them over time.</li>
        <li style={li}><span style={code}>effort.times_spoken_total</span> — lifetime count of turns. The one number a learner sees. Only ever goes up; no streaks.</li>
        <li style={li}><span style={code}>sightings</span> — how many <i>qualifying</i> times each skill has been shown. Ownership needs ≥{`${''}`}3 (corroboration), so one lucky chat doesn't own a skill.</li>
        <li style={li}><span style={code}>strength</span> — unprompted demonstrations; future decay reads this.</li>
        <li style={li}><span style={code}>last_seen</span> — date each skill last appeared; future decay reads this.</li>
        <li style={li}><span style={code}>updated_after_chat</span> — which chat last changed this memory.</li>
      </ul>
    </RM>

    <RM t="How a skill becomes 'owned' (the rule that matters most)">
      <p style={p}>Three states: <b>locked → emerging → owned</b>. A skill enters <i>emerging</i> on first real evidence. It becomes <i>owned</i> when it's been shown well enough, <b>enough times</b>:</p>
      <ul style={{margin:'0 0 0 16px'}}>
        <li style={li}><b>The bar scales with level</b> — at A0 a skill is "owned" at confidence ≥0.55 (understood is enough); by A2 it needs ≥0.68 (accuracy matters). A beginner owns by being understood; an advanced learner owns by being correct.</li>
        <li style={li}><b>Needs ≥3 sightings</b> across chats — not one lucky moment.</li>
        <li style={li}><b>Effort path at A0/A1</b> — repeated honest attempts can own a skill even without a peak score, because the principle is <i>reward effort, not accuracy</i>.</li>
        <li style={li}><b>Never demotes</b> here (decay is deferred).</li>
      </ul>
    </RM>

    <RM t="Units mode: how you advance (communicate-to-advance)">
      <p style={p}>A unit (step) completes when its <b>fluency &amp; vocabulary</b> skills are owned AND its <b>grammar</b> skills are at least <i>emerging</i> (attempted, not locked). Grammar is allowed to keep maturing in later units. This stops a beginner being walled by one hard grammar skill, and keeps the gate aligned with "reward effort." Completing all steps = level-up.</p>
    </RM>

    <RM t="How topics work (why chats stay fresh)">
      <p style={p}>The <i>skill</i> being targeted may repeat for several chats (a skill takes ≥3 sightings to own). To stop chats feeling samey, the <b>topic</b> changes: a topic bank (from the framework — themes like family, sports, festivals) supplies a fresh topic each chat, chosen to match the learner's interests and avoid <span style={code}>units</span>. Same skill, new context each time. <b>Updated:</b> topics are now lightly tagged to skill functions, and each due skill also carries a Teacher Invisible Plan: strong question, fallback, and judgeable evidence.</p>
    </RM>

    <RM t="What changed in the 9/10 pass — for reviewers">
      <p style={p}>Use this section to understand what improved before you hand the file to colleagues. The core upgrade is: <b>Zoe is no longer just chatting; Zoe is now steering a tiny learning session toward judgeable evidence.</b></p>
      <ul style={{margin:'0 0 0 16px'}}>
        <li style={li}><b>Mini-lesson arc:</b> each chat now tracks whether it is in <i>warm-up</i>, <i>target practice</i>, <i>extension</i>, or <i>recap/close</i>. The learner can see the phase as a small pill in the mission card.</li>
        <li style={li}><b>Stronger Zoe steering:</b> the first Zoe question is deterministic from the target skill’s Teacher Invisible Plan, so the learner gets a fair chance to show the due skill.</li>
        <li style={li}><b>Clear learner mission:</b> the child view now says the tiny goal for the chat and provides a sentence starter, so colleagues can immediately understand what the learner is supposed to try.</li>
        <li style={li}><b>Help buttons:</b> added <i>help me answer</i>, <i>make it easier</i>, and <i>example</i> quick actions so a weak learner is not stuck staring at a blank input.</li>
        <li style={li}><b>Stuck/emotion handling:</b> learner text like “I don't know”, “make it easier”, “example”, “I'm bored”, or “I'm tired” is detected and routed to simpler scaffolding or emotional support.</li>
        <li style={li}><b>Better mock fallback:</b> if a live LLM is unavailable, the fallback no longer re-asks information the learner already gave. Example: after name/age/city, Zoe moves to “Tell me one thing you like.”</li>
        <li style={li}><b>Prompt section improved:</b> the default prompts now give Zoe clearer turn-length rules, anti-repetition rules, stuck/help handling, micro-skill behaviour, unit behaviour, and stricter judge scoring anchors.</li>
        <li style={li}><b>Better child-facing recap:</b> after judging, the learner sees what evidence was heard, what progress changed, how many targets were hit, and what Zoe will ask next.</li>
        <li style={li}><b>Better reviewer visibility:</b> the due_next tab still shows the strong question, fallback, and judgeable evidence, so colleagues can inspect whether the pedagogy is fair.</li>
      </ul>
    </RM>

    <RM t="Suggested colleague demo script">
      <ol style={{margin:'0 0 0 18px'}}>
        <li style={li}>Open this file and stay on the <b>📖 Read me</b> tab for 60 seconds.</li>
        <li style={li}>Try <b>micro-skill</b> mode first. Answer: “My name is Aarav. I am ten. I am from Pune. I like football.” Then end and judge.</li>
        <li style={li}>Click <b>Next chat →</b> and watch how due_next and the opening question change.</li>
        <li style={li}>Switch to <b>units</b> mode. Notice Zoe now asks for picture/place description instead of random small talk.</li>
        <li style={li}>Test a stuck learner: type “I don't know” or press <b>Example</b>. Zoe should simplify instead of judging harshly.</li>
        <li style={li}>Open <b>🧠 Memory</b>, <b>⚖️ Judge</b>, <b>🎯 due_next</b>, and <b>📄 Session</b> to see the full learning loop.</li>
      </ol>
    </RM>

    <RM t="What still needs work after this pass">
      <ul style={{margin:'0 0 0 16px'}}>
        <li style={li}><b>Voice is still not included:</b> pronunciation, listening quality, STT errors, and spoken fluency are future work.</li>
        <li style={li}><b>Safe sharing needs a backend proxy:</b> direct browser keys are okay for local testing, but colleagues should ideally use a proxy so API keys are not exposed.</li>
        <li style={li}><b>Teacher calibration is still needed:</b> the judge should be benchmarked against human teacher labels before production use.</li>
        <li style={li}><b>UI is still simulator-level:</b> good enough to demo the loop, not yet a polished child-facing mobile app.</li>
      </ul>
    </RM>

    <RM t="What to look at to judge if the loop works">
      <ul style={{margin:'0 0 0 16px'}}>
        <li style={li}><b>Does Zoe actually steer to the primary skill?</b> Compare 🎯 due_next's primary against what the chat covered. If she drifts, due_next is decorative.</li>
        <li style={li}><b>aimed vs hit</b> (History &amp; Session tabs) — of the skills we aimed at, how many actually showed up.</li>
        <li style={li}><b>Does the judge score sensibly?</b> Read the ⚖️ Judge evidence quotes — do the confidences match what the learner really did?</li>
        <li style={li}><b>Does memory evolve believably?</b> Watch owned climb and due_next shift across chats (Memory snapshots).</li>
        <li style={li}><b>Does it stall?</b> Run a weak learner (manual mode, give short broken answers) — do they get stuck, and does that feel fair?</li>
      </ul>
    </RM>

    <div className="note" style={{marginTop:6}}><span className="lab">Honest limits</span>This proves the <b>loop and the prompts</b>, not the production model or the voice layer. It uses typed text (no speech/STT), and the model is whatever ⚙︎ LLM is set to (Claude runtime by default, not Gemini). Treat the behaviour as directional, not final.</div>
  </div>);
}
function MemoryView({mem,hl,changes,snapshots,dbMemory,isApiMode,showClientSide}){
  const getSkillBadge = (id) => {
    if (!id || typeof id !== 'string') return id;
    let bg = '#eee';
    let fg = '#666';
    let border = '1px solid #ccc';
    if (id.includes('-VOC-')) {
      bg = 'var(--green-soft)';
      fg = 'var(--green-dk)';
      border = '1px solid var(--green)';
    } else if (id.includes('-GRA-')) {
      bg = 'var(--purple-soft)';
      fg = 'var(--purple)';
      border = '1px solid var(--purple)';
    } else if (id.includes('-FLU-')) {

      fg = 'var(--blue)';

    return (
      <span key={id} style={{
        display: 'inline-block',
        padding: '2px 6px',
        borderRadius: '4px',
        fontSize: '11px',
        fontWeight: 'bold',
        fontFamily: 'monospace',
        background: bg,
        color: fg,
        border: border,
        margin: '2px',
        verticalAlign: 'middle'
      }}>
        {id}

    );
  };

  const renderDbMemoryTable = () => {
    if (!dbMemory || Object.keys(dbMemory).length === 0) {

    }

    const rows = [
      { col: 'profile', type: 'JSON', val: dbMemory.profile },

      { col: 'emerging', type: 'JSON', val: dbMemory.emerging || [] },
      { col: 'due_next', type: 'JSON', val: dbMemory.due_next || {} },
      { col: 'next_topics', type: 'JSON', val: dbMemory.next_topics || null },
      { col: 'units', type: 'JSON', val: dbMemory.units || dbMemory.last_topics || [] },
      { col: 'last_topics', type: 'JSON', val: dbMemory.last_topics || [] },
      { col: 'interests', type: 'VARCHAR(200)', val: dbMemory.interests && dbMemory.interests.length > 0 ? dbMemory.interests.join(',') : '' },
      { col: 'placement', type: 'JSON', val: dbMemory.placement || null },
      { col: 'last_time_recap', type: 'VARCHAR(200)', val: dbMemory.last_time_recap || '—' },
      { col: 'effort', type: 'JSON', val: dbMemory.effort || { times_spoken_total: 0 } },
      { col: 'sightings', type: 'JSON', val: dbMemory.sightings || {} },
      { col: 'strength', type: 'JSON', val: dbMemory.strength || {} },
      { col: 'updated_after_chat', type: 'INTEGER', val: dbMemory.updated_after_chat !== undefined ? String(dbMemory.updated_after_chat) : '0' }
    ];

    const renderValueCell = (col, val) => {
      if (col === 'placement') {
        if (!val) return <span style={{ color: 'var(--grey)', fontFamily: 'monospace', fontSize: '11px' }}>null</span>;
        return (
          <pre style={{ margin: 0, padding: '4px 6px', background: '#f4f1ea', borderRadius: '4px', border: '1px solid var(--rule)', overflowX: 'auto', fontSize: '10px', whiteSpace: 'pre-wrap', lineHeight: '1.4', fontFamily: 'monospace' }}>
            {JSON.stringify(val, null, 2)}
          </pre>
        );
      }
      if (col === 'next_topics') {
        if (!val) return <span style={{ color: 'var(--grey)', fontFamily: 'monospace', fontSize: '11px' }}>null</span>;
        return (
          <pre style={{ margin: 0, padding: '4px 6px', background: '#f4f1ea', borderRadius: '4px', border: '1px solid var(--rule)', overflowX: 'auto', fontSize: '10px', whiteSpace: 'pre-wrap', lineHeight: '1.4', fontFamily: 'monospace' }}>
            {JSON.stringify(val, null, 2)}
          </pre>
        );
      }
      if (col === 'profile') {
        const prof = val || { name: '—', age: null, city: '—', grade: null };
        return (
          <pre style={{ margin: 0, padding: '4px 6px', background: '#f4f1ea', borderRadius: '4px', border: '1px solid var(--rule)', overflowX: 'auto', fontSize: '10px' }}>
            {JSON.stringify(prof, null, 2)}
          </pre>
        );
      }
      if (col === 'owned' || col === 'emerging' || col === 'units' || col === 'last_topics') {
        const arr = val || [];
        if (arr.length === 0) {
          return <span style={{ fontFamily: 'monospace', fontSize: '11px' }}>[]</span>;
        }
        return (
          <div style={{ padding: '4px 6px', background: '#f4f1ea', borderRadius: '4px', border: '1px solid var(--rule)', display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '2px' }}>
            <span style={{ fontFamily: 'monospace', fontSize: '11px', color: 'var(--grey)' }}>[</span>
            {arr.map((item, idx) => (
              <React.Fragment key={idx}>
                {getSkillBadge(item)}
                {idx < arr.length - 1 && <span style={{ fontFamily: 'monospace', fontSize: '11px', color: 'var(--grey)', marginRight: '2px' }}>,</span>}
              </React.Fragment>
            ))}
            <span style={{ fontFamily: 'monospace', fontSize: '11px', color: 'var(--grey)' }}>]</span>
          </div>
        );
      }
      if (col === 'due_next') {
        const due = val || {};

                    <React.Fragment key={idx}>
                      {getSkillBadge(item)}
                      {idx < due.watching.length - 1 && <span style={{ color: 'var(--grey)', marginRight: '2px' }}>,</span>}
                    </React.Fragment>
                  ))}
                </span>
              ) : null}
              ]
            </div>
            <div>{'}'}</div>
          </div>
        );
      }
      if (col === 'sightings' || col === 'strength') {
        const obj = val || {};
        const keys = Object.keys(obj);
        if (keys.length === 0) {
          return <span style={{ fontFamily: 'monospace', fontSize: '11px' }}>{'{}'}</span>;
        }
        return (
          <div style={{ padding: '4px 6px', background: '#f4f1ea', borderRadius: '4px', border: '1px solid var(--rule)', fontFamily: 'monospace', fontSize: '11px', lineHeight: '1.6' }}>
            <div>{'{'}</div>
            {keys.map((k, idx) => (
              <div key={idx} style={{ paddingLeft: '15px', display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: '4px' }}>
                {getSkillBadge(k)}: <span style={{ color: 'var(--blue)', fontWeight: 'bold' }}>{String(obj[k])}</span>
                {idx < keys.length - 1 && <span>,</span>}
              </div>
            ))}
            <div>{'}'}</div>
          </div>
        );
      }
      if (col === 'effort') {
        return (
          <pre style={{ margin: 0, padding: '4px 6px', background: '#f4f1ea', borderRadius: '4px', border: '1px solid var(--rule)', fontSize: '10px' }}>
            {JSON.stringify(val, null, 2)}
          </pre>
        );
      }
      return <span>{val}</span>;
    };

    return (
      <table style={{
        width: '100%',
        borderCollapse: 'collapse',
        fontFamily: "'JetBrains Mono', ui-monospace, monospace",
        fontSize: '11px',
        border: '1.5px solid var(--ink)',
        borderRadius: '8px',
        overflow: 'hidden',
        background: '#fff',
        boxShadow: '2px 2px 0 var(--ink)',
        marginTop: '8px',
        marginBottom: '14px'
      }}>
        <thead>
          <tr style={{ background: 'var(--paper2)', borderBottom: '2px solid var(--ink)' }}>
            <th style={{ padding: '8px 10px', textAlign: 'left', fontWeight: '700', borderRight: '1.5px solid var(--ink)', width: '25%' }}>Column</th>
            <th style={{ padding: '8px 10px', textAlign: 'left', fontWeight: '700', borderRight: '1.5px solid var(--ink)', width: '20%' }}>Type</th>
            <th style={{ padding: '8px 10px', textAlign: 'left', fontWeight: '700', width: '55%' }}>Value</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={i} style={{ borderBottom: i === rows.length - 1 ? 'none' : '1px solid var(--rule)', background: i % 2 === 1 ? '#faf8f5' : '#fff' }}>
              <td style={{ padding: '8px 10px', fontWeight: 'bold', color: 'var(--purple)', borderRight: '1px solid var(--rule)' }}>{r.col}</td>
              <td style={{ padding: '8px 10px', color: 'var(--grey)', borderRight: '1px solid var(--rule)' }}>{r.type}</td>
              <td style={{ padding: '8px 10px', verticalAlign: 'top', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>
                {renderValueCell(r.col, r.val)}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    );
  };

  return(<div>
    {changes.length>0&&<div><div className="lbl">state changes this chat</div>
      {changes.map((c,i)=><div className="chg" key={i}><b>{c.id}</b> — {c.name || skillText(c.id)}<br/>{c.from} → <b>{c.to}</b> {c.to==='owned'?'🌸':'🌱'}</div>)}</div>}
    {(!isApiMode || showClientSide) && <><div className="lbl">Local memory (client-side) {mem.updated_after_chat>0?('· updated after chat '+mem.updated_after_chat):'· (fresh)'}</div>
    <div className="mono" style={{whiteSpace:"pre-wrap",fontSize:"11px",lineHeight:"1.5",maxHeight:"400px",overflowY:"auto"}}>{JSON.stringify({profile:{name:mem.name||"—",age:mem.age||null,city:mem.city||"—"},level:mem.level,owned:mem.owned,emerging:mem.emerging,due_next:mem.due_next,units:(mem.units||mem.last_topics||[]).slice(-5),interests:(mem.interests||"").slice(0,100),effort:mem.effort,sightings:mem.sightings,strength:mem.strength},null,2)}</div></>}
      <div style={{marginTop:14}}>
        <div className="lbl">{isApiMode ? 'Memory (from GET /users/me/memory)' : 'Database Record (PostgreSQL users table)'}</div>
        {renderDbMemoryTable()}
      </div>
    {snapshots.length>0&&<div><div className="lbl">memory after each chat</div>
      {snapshots.map((s,i)=><div className="hist" key={i}><b>after chat {s.chat}</b> ({s.model}) · owned {s.owned.length} · emerging {s.emerging.length}<br/><span style={{fontFamily:'monospace',fontSize:'10px',color:'#5b50c4'}}>due → {s.due.join(', ')}</span></div>)}</div>}
    <small className="note">owned/emerging hold buckets; confidence is NOT stored here (see Session log). Snapshots show how memory evolved chat by chat.</small>
    {isApiMode&&<div style={{marginTop:16,padding:12,border:'1.5px dashed var(--rust)',borderRadius:8,background:'#fff5f5'}}>
      <div style={{fontSize:12,fontWeight:700,color:'var(--rust)',marginBottom:6}}>⚠️ Danger Zone</div>
      <button className="ghost" style={{color:'var(--rust)',borderColor:'var(--rust)',marginBottom:6}} onClick={async ()=>{if(confirm('This will RESET your current user — delete placements, level, skills. Continue?')){try{const did=localStorage.getItem('ella_device_id');if(did){await callEllaAPI(`/admin/reset-user/${did}`,'DELETE');} }catch(e){console.error(e);}window.location.reload();}}}>🔄 Reset User (keep device, clear all progress)</button>
      <button className="ghost" style={{color:'var(--rust)',borderColor:'var(--rust)'}} onClick={()=>{if(confirm('This will create a BRAND NEW user. All progress lost. Continue?')){localStorage.removeItem('ella_access_token');localStorage.removeItem('ella_device_id');window.location.reload();}}}>🗑️ Delete & Start Fresh (new user)</button>
    </div>}
  </div>);
}
function JudgeView({scores,debug,backendAnalysis,isApiMode,level}){
  if(!scores && !backendAnalysis)return<div style={{color:'#8a8678'}}>No judge run yet. Have a short chat, then <b>End chat &amp; judge</b>.</div>;
  const dbg=debug&&debug.primary;
  return(<div>
    {isApiMode && backendAnalysis && (
      <div style={{marginBottom: 16}}>
        <div className="lbl">Qualitative Analysis (Ella API)</div>
        <div style={{border: '1.5px solid var(--ink)', borderRadius: 8, padding: 12, background: '#fff', boxShadow: '2px 2px 0 var(--ink)'}}>
          <div style={{marginBottom: 8}}><b>Overall:</b> <span style={{color: 'var(--green-dk)', fontWeight: 'bold'}}>{backendAnalysis.overall}</span></div>
          {backendAnalysis.best_moment && (
            <div style={{marginBottom: 8, paddingLeft: 8, borderLeft: '3px solid var(--green)'}}>
              <b>🌟 Best Moment:</b> <i>"{backendAnalysis.best_moment.quote}"</i>
              <div style={{fontSize: 12, color: 'var(--grey)'}}>{backendAnalysis.best_moment.note}</div>
            </div>
          )}
          {backendAnalysis.courage_or_motivation && (
            <div style={{marginBottom: 8, paddingLeft: 8, borderLeft: '3px solid var(--purple)'}}>
              <b>🌱 Courage/Motivation Highlight:</b> <span>{backendAnalysis.courage_or_motivation.content}</span>
            </div>
          )}
          {backendAnalysis.try_next_time && (
            <div style={{marginBottom: 8, paddingLeft: 8, borderLeft: '3px solid var(--amber)'}}>
              <b>🎯 Recommendation:</b> <span>Focus on skill: <u>{backendAnalysis.try_next_time.skill}</u></span>
              <div style={{fontSize: 12, color: 'var(--grey)'}}>Example: {backendAnalysis.try_next_time.example}</div>
            </div>
          )}
          {backendAnalysis.extracted_memory_facts && backendAnalysis.extracted_memory_facts.length > 0 && (
            <div>
              <b>🧠 Extracted Memory Facts:</b>
              <ul style={{marginLeft: 18, marginTop: 4, fontSize: 12}}>
                {backendAnalysis.extracted_memory_facts.map((f, idx) => <li key={idx}>{f}</li>)}
              </ul>
            </div>
          )}
        </div>
      </div>
    )}

    <div className="lbl">{isApiMode ? 'Quantitative Skill Grading (LLM Judge)' : 'judge output — skills_evidenced[]'}</div>
    {dbg&&<div className={dbg.used_mock?'warn':'ev'}><b>Judge debug:</b> {dbg.ok?'LLM responded':'LLM failed'}{dbg.err?(' · '+dbg.err):''}{dbg.parse_error?(' · JSON parse error: '+dbg.parse_error):''}{dbg.used_mock?' · using mock fallback scores':''}</div>}
    {scores && scores.map((s,i)=>(<div className="ev" key={i}>
      <span className="conf" style={{color:s.confidence>=0.7?'#23682f':'#b8472f'}}>{Number(s.confidence).toFixed(2)}</span>
      <span className="id">{s.id}</span> {s.prompted?'· prompted':'· unprompted'}
      <span className="nm">{skillText(s.id, level)}</span>
      <div className="confbar"><i style={{width:(s.confidence*100)+'%'}}></i></div>
      {s.evidence&&<div style={{marginTop:5,fontStyle:'italic',color:'#4a443c'}}>"{s.evidence}"</div>}
      <div style={{marginTop:5,fontSize:11,color:'#6b6258'}}><b>Reason:</b> {s.miss_reason||missReason(s, level)}</div>
      <div style={{marginTop:5,fontSize:11,color:'#5b50c4'}}><b>Next Zoe move:</b> {skillPlan(s.id, level).fallback}</div>
    </div>))}
    {dbg&&dbg.raw&&<details style={{marginTop:8}}><summary className="lbl" style={{cursor:'pointer'}}>raw judge output</summary><div className="mono" style={{whiteSpace:'pre-wrap'}}>{dbg.raw}</div></details>}
    <small className="note">≥0.70 qualifying evidence · &lt;0.70 ignored. Reasons show whether Zoe needs a better elicitation follow-up.</small>
  </div>);
}

function DualView({dual,level}){
  if(!dual)return<div style={{color:'#8a8678'}}>No comparison yet. End a chat — the same transcript is judged under BOTH models and shown side by side.</div>;

function PromptView({text, level, tabActive, sessionType, mem, prompts, lastSystemPrompt}){
  // Live-read textareas from the Prompts tab (Server mode) — updates on edit
  const [liveText, setLiveText] = React.useState(null);
  React.useEffect(() => {
    const poll = () => { if (window.__editedPrompts) setLiveText(window.__editedPrompts); };
    poll();
    const interval = setInterval(poll, 1000);
    return () => clearInterval(interval);
  }, []);
  // Build context-appropriate prompt based on current session type
  let displayText, isLive, promptLabel;
  if (sessionType === 'placement') {
    // During placement: use prompts prop (server data) as base, override with edited textarea values if present
    // Find edited values by data-key attribute (more reliable than text search)
    const getEditedByKey = (key) => {
      const ta = document.querySelector('textarea[data-promptkey="' + key + '"]');
      return ta ? ta.value.trim() : null;
    };
    const editedPlacement = getEditedByKey('placement');
    const editedBase = getEditedByKey('base');
    // Fall back to prompts prop (fresh from server via GET /admin/prompts)
    const placementTxt = editedPlacement || (prompts && prompts.placement) || '';
    const baseTxt = editedBase || (prompts && prompts.base) || '';
    const name = (mem && mem.name) || 'the learner';
    const age = (mem && mem.age) ? String(mem.age) : '';
    const filled = placementTxt.replace(/\{\{NAME\}\}/g, name).replace(/\{\{AGE\}\}/g, age);
    displayText = [filled, baseTxt].filter(Boolean).join('\n\n---\n\n');
    isLive = !!(editedPlacement || editedBase);
    promptLabel = '🔍 Placement prompt — what Zoe actually receives (placement + base only)';
  } else {
    // Conversation mode:
    // Priority 1: last real system prompt from backend (prompt_debug)
    // Priority 2: edited base + active level profile textareas
    // Priority 3: nothing to show yet
    const getEditedByKey2 = (key) => { const ta = document.querySelector('textarea[data-promptkey="' + key + '"]'); return ta ? ta.value.trim() : null; };
    const editedBase2 = getEditedByKey2('base');
    const profileKey = 'profile-' + (level || 'A0').toUpperCase();
    const editedProfile = getEditedByKey2(profileKey);
    const hasEdits = !!(editedBase2 || editedProfile);
    if (lastSystemPrompt) {
      // Show the exact prompt the backend sent to the LLM on the last turn
      displayText = lastSystemPrompt;
      isLive = true;
      promptLabel = '🔍 Real prompt sent to Zoe (from last API turn)';
    } else if (hasEdits) {
      const basePart = editedBase2 || (prompts && prompts.base) || '';
      const profilePart = editedProfile || (prompts && prompts.level_profiles && prompts.level_profiles[(level||'A0').toUpperCase()]) || '';
      displayText = [basePart, profilePart].filter(Boolean).join('\n\n---\n\n');
      isLive = true;
      promptLabel = '✏️ edited prompts (will be sent on next turn)';
    } else {
      displayText = (prompts && prompts.base) ? ((prompts.base) + '\n\n---\n\n' + ((prompts.level_profiles && prompts.level_profiles[(level||'A0').toUpperCase()]) || '')) : '';
      isLive = false;
      promptLabel = '📋 production prompt (base + ' + (level||'A0') + ' profile) — start a conversation to see the real assembled prompt';
    }
  }

  let sections = [];
  if (sessionType === 'placement') {
    const parts = displayText.split(/\n\s*---\s*\n/);
    sections = [
      { label: 'PLACEMENT PROMPT', color: '#8b5cf6', bg: '#ffffff', text: parts[0]?.trim() || '' },
      { label: 'BASE PROMPT', color: '#10b981', bg: '#ffffff', text: parts[1]?.trim() || '' }
    ].filter(s => s.text);
  } else {
    // Split by the --- separator
    const parts = displayText.split(/\n\s*---\s*\n/);
    if (parts.length >= 3) {
      // If we have at least 3 parts, it's: Base, Level Profile, and Unit Framing
      sections = [
        { label: 'BASE PROMPT', color: '#10b981', bg: '#ffffff', text: parts[0].trim() },
        { label: 'LEVEL PROFILE', color: '#3b82f6', bg: '#ffffff', text: parts[1].trim() },
        { label: 'UNIT FRAMING & CONTRACT', color: '#f59e0b', bg: '#ffffff', text: parts.slice(2).join('\n\n---\n\n').trim() }
      ];
    } else if (parts.length === 2) {
      sections = [
        { label: 'BASE PROMPT', color: '#10b981', bg: '#ffffff', text: parts[0].trim() },
        { label: 'LEVEL PROFILE', color: '#3b82f6', bg: '#ffffff', text: parts[1].trim() }
      ];
    } else {
      sections = [{ label: 'SYSTEM PROMPT', color: '#10b981', bg: '#ffffff', text: displayText.trim() }];
    }
  }

  return(<div><VersionBadge />
  <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
    <div className="lbl" style={{margin:0}}>{promptLabel}</div>
    {React.createElement(()=>{
      const [c,setC]=React.useState(false);
      return <button onClick={()=>{navigator.clipboard.writeText(displayText).then(()=>{setC(true);setTimeout(()=>setC(false),2000);}).catch(()=>{const ta=document.createElement('textarea');ta.value=displayText;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);setC(true);setTimeout(()=>setC(false),2000);});}} style={{padding:'3px 10px',fontSize:11,fontWeight:600,background:c?'#2f7d46':'white',color:c?'white':'inherit',border:'1.5px solid var(--ink)',borderRadius:6,cursor:'pointer',flexShrink:0}}>{c?'✓ Copied':'Copy'}</button>;
    },{})}
  </div>
    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      {sections.map((s, i) => (
        <div key={i} style={{background:s.bg,borderLeft:'3px solid '+s.color,borderRadius:4,padding:'12px 12px 12px 16px',position:'relative',background:'#fafaf8'}}>
          <div style={{position:'absolute',top:-9,left:12,background:'#fafaf8',padding:'0 6px',fontSize:11,fontWeight:700,color:s.color,letterSpacing:'0.5px',textTransform:'uppercase'}}>{s.label}</div>
          <pre className="mono" style={{margin:0,whiteSpace:'pre-wrap',wordBreak:'break-word',color:'#2C1E0F',fontSize:12.5,lineHeight:1.5}}>{s.text}</pre>
        </div>
      ))}
    </div>
    <small className="note">Each colored section shows which building block produced that part of the final prompt. Base (green) | Profile (blue) | Framing (amber) | Placement (purple).</small>
  </div>);
}
